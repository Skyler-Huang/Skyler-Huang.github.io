<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F2EE">
<title>主动中枢</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
/* ===========================================================================
   主动中枢 · 在线工作台
   和本地版同一套视觉语言：暖纸底、靛蓝主色、等宽数字。
   =========================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F4F2EE; --card:#FFFFFF; --ink:#14161A; --muted:#5A6068; --faint:#8A9099;
  --line:#E8E5DF; --line-2:#F1F0EC;
  --brand:#4B57CE; --brand-soft:#EEF0FC;
  --hot:#C7362F; --hot-soft:#FDECEB;
  --warm:#B5761F; --warm-soft:#FBF2E4;
  --ok:#2F7D5C; --ok-soft:#E9F5EE;
  --mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:12px;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand)}

/* ------------------------------------------------------------ 登录页 */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:32px 28px;max-width:380px;width:100%;box-shadow:0 8px 32px -12px rgba(20,22,26,.14)}
.login-box h1{font-size:21px;margin:0 0 6px;letter-spacing:-.02em}
.login-box p{margin:0 0 22px;color:var(--faint);font-size:13px;line-height:1.6}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
input[type=email],input[type=password],input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;
  border-radius:9px;font-size:13.5px;font-weight:500;transition:all .13s;white-space:nowrap}
.btn:hover{border-color:#D8D4CC;background:#FCFBF9}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.pri:hover{background:#3F4AB8;border-color:#3F4AB8}
.btn.wide{width:100%;padding:12px;font-size:15px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--faint);padding:6px 9px;font-size:12px}
.btn.ghost:hover{background:var(--line-2);color:var(--ink)}
.err{background:var(--hot-soft);color:var(--hot);border-radius:8px;padding:9px 12px;
  font-size:12.5px;margin-bottom:13px;display:none}
.err.on{display:block}

/* ------------------------------------------------------------ 布局 */
#app{display:none;max-width:1000px;margin:0 auto;padding:0 16px 60px}
header.top{position:sticky;top:0;z-index:20;background:rgba(244,242,238,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);margin:0 -16px 0;padding:11px 16px 0}
.top-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand{font-weight:700;font-size:15.5px;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.brand .dotmark{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.top-meta{margin-left:auto;font-size:12px;color:var(--faint);font-family:var(--mono);text-align:right;line-height:1.35}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;padding:9px 11px 10px;font-size:13.5px;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;transition:color .13s}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

main{padding-top:20px}
h2{font-size:19px;margin:0;letter-spacing:-.02em}
.vhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.vhead .sub{font-size:12.5px;color:var(--faint);font-family:var(--mono)}
.vdesc{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.6}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card>header{display:flex;align-items:center;gap:8px;padding:12px 15px 11px;border-bottom:1px solid var(--line-2)}
.accent{width:3px;height:13px;border-radius:2px;background:var(--brand);flex:none}
.card>header h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.card>header .extra{margin-left:auto;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.card .body.pad{padding:14px 15px}
.card .body{font-size:13.5px}

/* 列表 */
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 15px;border-top:1px solid var(--line-2)}
.li:first-child{border-top:none}
.li .grow{flex:1;min-width:0}
.sub{font-size:12px;color:var(--faint);line-height:1.5}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;
  background:var(--line-2);color:var(--muted);flex:none;margin-top:2px}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.hot{background:var(--hot-soft);color:var(--hot)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.empty{padding:22px 15px;text-align:center;color:var(--faint);font-size:13px}
.hint{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:9px}
.done-row{opacity:.48}
.done-row .t{text-decoration:line-through}

/* 统计 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#FBFAF8;border:1px solid var(--line-2);border-radius:9px;padding:11px 12px}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:11px;color:var(--faint);margin-top:3px}
.stat.hi{background:var(--brand-soft);border-color:transparent}
.stat.hi .v{color:var(--brand)}
.bar{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .5s}

/* 课表 */
.day{border-top:1px solid var(--line-2)}
.day:first-child{border-top:none}
.day-h{display:flex;align-items:center;gap:8px;padding:8px 15px;background:#FBFAF8;
  font-size:12px;color:var(--muted);font-family:var(--mono);position:sticky;top:0}
.day.today .day-h{background:var(--brand-soft);color:var(--brand);font-weight:600}
.course{display:flex;gap:11px;padding:9px 15px;align-items:baseline}
.course .time{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--brand);flex:none;width:44px}
.course .nm{font-weight:500}
.course .loc{font-size:12px;color:var(--faint)}

/* 表单 */
.form{display:flex;gap:8px;flex-wrap:wrap}
.form>*{flex:1;min-width:110px}
.row-acts{display:flex;gap:4px;flex:none;opacity:0;transition:opacity .13s}
.li:hover .row-acts,.li:focus-within .row-acts{opacity:1}
@media(hover:none){.row-acts{opacity:1}}

/* 报告 */
.report{white-space:pre-wrap;font-size:13px;line-height:1.7;font-family:var(--sans)}
.report h1{font-size:16px;margin:0 0 4px}
.report blockquote{margin:10px 0;padding:10px 13px;background:var(--brand-soft);
  border-left:3px solid var(--brand);border-radius:0 8px 8px 0;color:#33383F}
.report h2{font-size:13.5px;margin:16px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--line-2)}
.report ul{margin:6px 0;padding-left:19px}
.report li{margin:3px 0}
.report code{font-family:var(--mono);font-size:11.5px;background:var(--line-2);padding:1px 5px;border-radius:4px}
.report hr{border:none;border-top:1px solid var(--line-2);margin:15px 0}
.report em{color:var(--faint);font-style:normal;font-size:12px}

/* 提示条 */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:100;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--hot)}
#loading{padding:60px 20px;text-align:center;color:var(--faint);font-size:13px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);
  border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:560px){
  #app{padding:0 12px 50px}
  header.top{margin:0 -12px;padding:10px 12px 0}
  .grid{grid-template-columns:1fr}
  .top-meta{font-size:11px}
}
</style>
</head>
<body>

<!-- ======================== 登录 ======================== -->
<div id="login">
  <div class="login-box">
    <h1>主动中枢</h1>
    <p>用你自己的账号登录。数据在 Supabase 上，行级安全策略保证只有你能看到自己的记录。</p>
    <div class="err" id="login-err"></div>
    <div class="field">
      <label>邮箱</label>
      <input type="email" id="email" autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn pri wide" id="do-login">登录</button>
    <div class="hint" id="login-hint">
      账号是在搭建时创建的。忘了就在本地跑 <code>node tools/status.mjs</code> 查看。
    </div>
  </div>
</div>

<!-- ======================== 主体 ======================== -->
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="brand"><span class="dotmark"></span>主动中枢</div>
      <div class="top-meta" id="top-meta"></div>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="main"><div id="loading"><span class="spin"></span> 读取中…</div></main>
</div>

<div id="toast"></div>

<script>
/* ===========================================================================
   配置
   anon key 是设计上就要公开的：它只标识「这是这个项目」，不带任何权限。
   真正的门是行级安全策略 —— 没登录读不到任何行。
   =========================================================================== */
const SB   = 'https://nmpseuwcmdsqypehluve.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tcHNldXdjbWRzcXlwZWhsdXZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MDM2MjEsImV4cCI6MjEwMDE3OTYyMX0.nXekidDzUX7atdw3BjWQuaGYMLUCKM2Ss5ZzNqxkEDQ';

const BJ = 8 * 3600 * 1000;   // 北京时间偏移
const $  = (s) => document.querySelector(s);

/* ------------------------------------------------------------ 会话 */
let S = null;
try { S = JSON.parse(localStorage.getItem('zs.session') || 'null'); } catch { S = null; }

function saveSession(v) {
  S = v;
  if (v) localStorage.setItem('zs.session', JSON.stringify(v));
  else localStorage.removeItem('zs.session');
}

async function authFetch(path, body) {
  const r = await fetch(`${SB}/auth/v1/${path}`, {
    method: 'POST',
    headers: { apikey: ANON, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const t = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(t.error_description || t.msg || t.error || `登录失败 (${r.status})`);
  return t;
}

async function doLogin(email, password) {
  const s = await authFetch('token?grant_type=password', { email, password });
  saveSession({
    access_token: s.access_token,
    refresh_token: s.refresh_token,
    expires_at: Date.now() + (s.expires_in ?? 3600) * 1000,
    email: s.user?.email ?? email,
  });
}

/** 令牌快过期就续期。续期失败视为登出。 */
async function ensureToken() {
  if (!S) throw new Error('未登录');
  if (Date.now() < S.expires_at - 60000) return S.access_token;
  try {
    const s = await authFetch('token?grant_type=refresh_token', { refresh_token: S.refresh_token });
    saveSession({ ...S, access_token: s.access_token, refresh_token: s.refresh_token,
      expires_at: Date.now() + (s.expires_in ?? 3600) * 1000 });
    return S.access_token;
  } catch (e) {
    saveSession(null);
    location.reload();
    throw e;
  }
}

/* ------------------------------------------------------------ 数据访问 */
async function api(path, opts = {}) {
  const token = await ensureToken();
  const r = await fetch(`${SB}${path}`, {
    ...opts,
    headers: {
      apikey: ANON,
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  const text = await r.text();
  if (!r.ok) {
    let msg = text.slice(0, 300);
    try { const j = JSON.parse(text); msg = j.message || j.error_description || j.hint || msg; } catch {}
    throw new Error(msg);
  }
  return text ? JSON.parse(text) : null;
}

const rpc  = (fn, args) => api(`/rest/v1/rpc/${fn}`, { method: 'POST', body: JSON.stringify(args || {}) });
const rest = (path, opts) => api(`/rest/v1/${path}`, opts);
const insert = (table, row) => rest(table, { method: 'POST', body: JSON.stringify(row),
  headers: { Prefer: 'return=minimal' } });
const patch = (table, filter, row) => rest(`${table}?${filter}`, { method: 'PATCH',
  body: JSON.stringify(row), headers: { Prefer: 'return=minimal' } });
const del = (table, filter) => rest(`${table}?${filter}`, { method: 'DELETE',
  headers: { Prefer: 'return=minimal' } });

/* ------------------------------------------------------------ 小工具 */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const pad = (n) => String(n).padStart(2, '0');

/** 把带时区的 ISO 串转成北京时间 HH:MM。
 *  必须自己做这个转换 —— toLocaleTimeString 依赖设备时区，
 *  在别的时区的电脑上打开会显示成当地时间。 */
function bjTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const x = new Date(d.getTime() + BJ);
  return `${pad(x.getUTCHours())}:${pad(x.getUTCMinutes())}`;
}
function bjDate(iso) {
  if (!iso) return '';
  const x = new Date(new Date(iso).getTime() + BJ);
  return `${x.getUTCFullYear()}-${pad(x.getUTCMonth() + 1)}-${pad(x.getUTCDate())}`;
}
const WD = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const WD_SHORT = ['', '一', '二', '三', '四', '五', '六', '日'];

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = ''; }, 2200);
}

const hm = (m) => (!m ? '0m' : m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? `${m % 60}m` : ''}` : `${m}m`);
const money = (n) => Number(n ?? 0).toFixed(2).replace(/\.00$/, '');

/** 极简 Markdown 渲染（只覆盖报告里实际用到的语法） */
function md(src) {
  const lines = String(src ?? '').split('\n');
  let out = '', inUl = false;
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/_([^_]+)_/g, '<em>$1</em>');
  for (const raw of lines) {
    const l = raw.replace(/\s+$/, '');
    if (/^-\s|^\*\s/.test(l)) {
      if (!inUl) { out += '<ul>'; inUl = true; }
      out += `<li>${inline(l.replace(/^[-*]\s+/, ''))}</li>`;
      continue;
    }
    if (inUl) { out += '</ul>'; inUl = false; }
    if (!l.trim()) continue;
    if (l.startsWith('### ')) out += `<h3>${inline(l.slice(4))}</h3>`;
    else if (l.startsWith('## ')) out += `<h2>${inline(l.slice(3))}</h2>`;
    else if (l.startsWith('# ')) out += `<h1>${inline(l.slice(2))}</h1>`;
    else if (l.startsWith('> ')) out += `<blockquote>${inline(l.slice(2))}</blockquote>`;
    else if (/^-{3,}$/.test(l)) out += '<hr>';
    else out += `<p style="margin:6px 0">${inline(l)}</p>`;
  }
  if (inUl) out += '</ul>';
  return out;
}

/* ===========================================================================
   视图
   =========================================================================== */
let D = null;                  // hub_data 的返回
let V = 'overview';            // 当前视图

/* ---------------------------------------------------------- 总览 */
function vOverview() {
  const t = D.scheduleToday ?? [], tm = D.scheduleTomorrow ?? [];
  const dl = (D.deadlines ?? []).filter((x) => !x.done).slice(0, 5);
  const tk = (D.tasks ?? []).filter((x) => !x.done).slice(0, 5);
  const st = D.study ?? {}, ex = D.expenses ?? {};
  const month = ex.month ?? {};

  const courseRow = (c) => `<div class="course">
    <span class="time">${bjTime(c.starts_at)}</span>
    <div class="grow"><div class="nm">${esc(c.title)}</div>
      ${c.subtitle ? `<div class="loc">${esc(c.subtitle)}</div>` : ''}</div>
  </div>`;

  const dlRow = (x) => {
    const d = x.days_left;
    const cls = d <= 1 ? 'hot' : d <= 3 ? 'warm' : 'plain';
    const txt = d < 0 ? '已过期' : d === 0 ? '今天' : `${d} 天后`;
    return `<div class="li">
      <span class="chip ${cls}">${txt}</span>
      <div class="grow"><div>${esc(x.title)}</div>
        <div class="sub">${x.due_at ? bjDate(x.due_at) : ''}${x.started ? '' : ' · 还没开始'}</div></div>
      <div class="row-acts">
        <button class="btn ghost" data-act="dl-done" data-id="${x.id}">完成</button>
      </div>
    </div>`;
  };

  const tkRow = (x) => `<div class="li">
    <span class="chip ${x.priority === 1 ? 'hot' : 'plain'}">${x.priority === 1 ? '高' : x.priority === 3 ? '低' : '中'}</span>
    <div class="grow"><div>${esc(x.title)}</div>
      ${x.due_date ? `<div class="sub">${x.due_date} 前</div>` : ''}</div>
    <div class="row-acts">
      <button class="btn ghost" data-act="tk-done" data-id="${x.id}">✓</button>
    </div>
  </div>`;

  const weekPct = st.weekMinutes && D.profile?.weekly_study_goal_minutes
    ? Math.min(100, Math.round((st.weekMinutes / D.profile.weekly_study_goal_minutes) * 100)) : 0;

  return `
  <div class="vhead"><h2>今天</h2>
    <span class="sub">${D.today} ${WD[D.weekday]}${D.weekNo ? ` · 第 ${D.weekNo} 教学周` : ''}</span></div>
  <p class="vdesc">${t.length ? `今天 ${t.length} 节课` : '今天没课'}${tm.length ? ` · 明天 ${tm.length} 节` : ''}</p>

  <div class="grid">
    <div class="card">
      <header><span class="accent"></span><h3>今日课程</h3>
        <span class="extra">${t.length} 节</span></header>
      <div class="body">${t.length ? t.map(courseRow).join('') : '<div class="empty">今天没课</div>'}</div>
    </div>

    <div class="card">
      <header><span class="accent" style="background:var(--hot)"></span><h3>倒计时</h3>
        <span class="extra">${dl.length} 项</span></header>
      <div class="body">${dl.length ? dl.map(dlRow).join('') : '<div class="empty">没有临近的截止日期</div>'}</div>
    </div>

    <div class="card">
      <header><span class="accent" style="background:var(--ok)"></span><h3>待办</h3>
        <span class="extra">${(D.tasks ?? []).filter((x) => !x.done).length} 项</span></header>
      <div class="body">${tk.length ? tk.map(tkRow).join('') : '<div class="empty">没有待办</div>'}</div>
    </div>

    <div class="card">
      <header><span class="accent" style="background:var(--warm)"></span><h3>学习</h3>
        <span class="extra">本周 ${hm(st.weekMinutes || 0)}</span></header>
      <div class="body pad">
        <div class="stats">
          <div class="stat hi"><div class="v">${hm(st.todayMinutes || 0)}</div><div class="l">今天</div></div>
          <div class="stat"><div class="v">${hm(st.yesterdayMinutes || 0)}</div><div class="l">昨天</div></div>
          <div class="stat"><div class="v">${st.streakDays || 0}天</div><div class="l">连续</div></div>
        </div>

        <div class="stats" style="grid-template-columns:repeat(2,1fr)">

/* ---------------------------------------------------------- 课表 */
function vWeek() {
  const days = D.week ?? [];
  const body = days.map((d) => `
    <div class="day${d.isToday ? ' today' : ''}">
      <div class="day-h">${d.date}　${WD[d.weekday]}${d.isToday ? '　· 今天' : ''}
        <span style="margin-left:auto">${(d.items ?? []).length || ''}</span></div>
      ${(d.items ?? []).length ? d.items.map((c) => `<div class="course">
        <span class="time">${(c.starts_at || '').slice(0, 5)}</span>
        <div class="grow"><div class="nm">${esc(c.name)}</div>
          <div class="loc">${esc([c.location, c.teacher].filter(Boolean).join(' · '))}</div></div>
      </div>`).join('') : '<div class="empty" style="padding:12px">—</div>'}
    </div>`).join('');

  const total = days.reduce((a, d) => a + (d.items ?? []).length, 0);

  return `
  <div class="vhead"><h2>本周课表</h2>
    <span class="sub">${D.weekNo ? `第 ${D.weekNo} 教学周 · ` : ''}共 ${total} 节</span></div>
  <p class="vdesc">单双周、考试周都已经算好了。下方是本周实际要上的课。</p>
  <div class="card"><div class="body">${body}</div></div>`;
}

/* ---------------------------------------------------------- 待办与截止 */
function vTodo() {
  const dl = D.deadlines ?? [];
  const tk = D.tasks ?? [];
  const openDl = dl.filter((x) => !x.done);
  const doneDl = dl.filter((x) => x.done);

  const dlRow = (x) => {
    const d = x.days_left;
    const txt = x.done ? '已完成' : d < 0 ? '已过期' : d === 0 ? '今天' : `${d} 天后`;
    const cls = x.done ? 'ok' : d <= 1 ? 'hot' : d <= 3 ? 'warm' : 'plain';
    return `<div class="li${x.done ? ' done-row' : ''}">
      <span class="chip ${cls}">${txt}</span>
      <div class="grow">
        <div class="t">${esc(x.title)}</div>
        <div class="sub">${x.due_at ? bjDate(x.due_at) + ' ' + bjTime(x.due_at) : ''}
          ${x.started ? '' : ' · 还没开始'}</div>
      </div>
      <div class="row-acts">
        <button class="btn ghost" data-act="dl-toggle" data-id="${x.id}" data-done="${x.done}">${x.done ? '撤销' : '完成'}</button>
        <button class="btn ghost" data-act="dl-del" data-id="${x.id}">删</button>
      </div>
    </div>`;
  };

  const tkRow = (x) => `<div class="li${x.done ? ' done-row' : ''}">
    <span class="chip ${x.priority === 1 ? 'hot' : 'plain'}">${x.priority === 1 ? '高' : x.priority === 3 ? '低' : '中'}</span>
    <div class="grow"><div class="t">${esc(x.title)}</div>
      <div class="sub">${x.due_date ? x.due_date + ' 前' : '无期限'}${x.source && x.source !== 'manual' ? ' · 来自手机' : ''}</div></div>
    <div class="row-acts">
      <button class="btn ghost" data-act="tk-toggle" data-id="${x.id}" data-done="${x.done}">${x.done ? '撤销' : '✓'}</button>
      <button class="btn ghost" data-act="tk-del" data-id="${x.id}">删</button>
    </div>
  </div>`;

  return `
  <div class="vhead"><h2>待办与截止</h2>
    <span class="sub">${openDl.length} 个截止 · ${tk.filter((x) => !x.done).length} 条待办</span></div>
  <p class="vdesc">截止日期会进早晚报的倒计时板块；待办会出现在总览和早报里。</p>

  <div class="grid">
    <div class="card">
      <header><span class="accent" style="background:var(--hot)"></span><h3>截止日期</h3></header>
      <div class="body pad" style="border-bottom:1px solid var(--line-2)">
        <div class="form">
          <input id="dl-title" placeholder="比如：成本会计第4次作业" style="flex:2">
          <input id="dl-date" type="date" style="flex:1">
          <input id="dl-time" type="time" value="23:59" style="flex:1">
          <button class="btn pri" id="dl-add">添加</button>
        </div>
      </div>
      <div class="body">${
        openDl.length ? openDl.map(dlRow).join('')
        : '<div class="empty">没有待完成的截止日期</div>'
      }${doneDl.length ? `<div class="sub" style="padding:10px 15px 4px">已完成 ${doneDl.length} 项</div>`
        + doneDl.slice(0, 6).map(dlRow).join('') : ''}</div>
    </div>

    <div class="card">
      <header><span class="accent" style="background:var(--ok)"></span><h3>待办</h3></header>
      <div class="body pad" style="border-bottom:1px solid var(--line-2)">
        <div class="form">
          <input id="tk-title" placeholder="要做什么" style="flex:2">
          <input id="tk-date" type="date" style="flex:1">
          <select id="tk-pri" style="flex:0 0 82px"><option value="1">高</option><option value="2" selected>中</option><option value="3">低</option></select>
          <button class="btn pri" id="tk-add">添加</button>
        </div>
      </div>
      <div class="body">${tk.length ? tk.map(tkRow).join('') : '<div class="empty">还没有待办</div>'}</div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------- 学习 */
function vStudy() {
  const st = D.study ?? {};
  const daily = st.daily ?? [];
  const max = Math.max(60, ...daily.map((d) => d.minutes || 0));
  const goal = D.profile?.weekly_study_goal_minutes ?? 840;
  const pct = Math.min(100, Math.round(((st.weekMinutes ?? 0) / goal) * 100));

  const bars = daily.map((d) => {
    const h = Math.round(((d.minutes || 0) / max) * 100);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"
      title="${d.date} ${hm(d.minutes)}${d.words ? ` · ${d.words} 词` : ''}">
      <div style="width:100%;height:70px;display:flex;align-items:flex-end">
        <div style="width:100%;height:${Math.max(h, 2)}%;min-height:3px;border-radius:3px;
          background:${d.minutes ? 'var(--brand)' : 'var(--line-2)'}"></div></div>
      <span style="font-size:9.5px;color:var(--faint);font-family:var(--mono)">${d.date.slice(8)}</span>
    </div>`;
  }).join('');

  const rows = (st.recent ?? []).map((l) => {
    const isStudy = l.kind === 'study';
    return `<div class="li">
      <span class="chip ${isStudy ? 'brand' : 'ok'}">${isStudy ? '自习' : '单词'}</span>
      <div class="grow">
        <span style="font-family:var(--mono);font-weight:700">${isStudy ? hm(l.minutes) : `${l.count} 个`}</span>
        ${l.note ? ` <span style="color:var(--muted)">· ${esc(l.note)}</span>` : ''}
        <div class="sub">${l.logged_on}</div>
      </div>
      <div class="row-acts"><button class="btn ghost" data-act="st-del" data-id="${l.id}">删</button></div>
    </div>`;
  }).join('');

  return `
  <div class="vhead"><h2>学习</h2>
    <span class="sub">本周 ${hm(st.weekMinutes || 0)} / 目标 ${hm(goal)}</span></div>
  <p class="vdesc">这些数字会进早报的「学习」板块。连续打卡天数按「从今天或昨天往前每天都有记录」计算。</p>

  <div class="grid">
    <div class="card">
      <header><span class="accent"></span><h3>记一笔</h3></header>
      <div class="body pad">
        <div class="form">
          <input id="st-min" type="number" placeholder="自习分钟，如 90" style="flex:2">
          <button class="btn pri" id="st-add">记下</button>
        </div>
        <div class="form" style="margin-top:9px">
          <input id="sw-count" type="number" placeholder="单词个数，如 50" style="flex:2">
          <input id="sw-note" placeholder="备注（可选）" style="flex:2">
          <button class="btn pri" id="sw-add">记下</button>
        </div>
        <div class="hint">也可以在手机上发「#自习 90」「#单词 50」自动记录。</div>
      </div>
    </div>

    <div class="card">
      <header><span class="accent" style="background:var(--warm)"></span><h3>本周进度</h3>
        <span class="extra">${pct}%</span></header>
      <div class="body pad">
        <div class="stats">
          <div class="stat hi"><div class="v">${hm(st.todayMinutes || 0)}</div><div class="l">今天</div></div>
          <div class="stat"><div class="v">${hm(st.yesterdayMinutes || 0)}</div><div class="l">昨天</div></div>
          <div class="stat"><div class="v">${st.streakDays || 0} 天</div><div class="l">连续</div></div>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="hint">今日单词 ${st.wordsToday || 0}${
          D.profile?.daily_word_goal ? ` / ${D.profile.daily_word_goal}` : ''
        }</div>
      </div>
    </div>

    <div class="card" style="grid-column:1/-1">
      <header><span class="accent" style="background:var(--muted)"></span><h3>最近 14 天</h3></header>
      <div class="body pad"><div style="display:flex;gap:4px;align-items:flex-end">${bars}</div></div>
    </div>

    <div class="card" style="grid-column:1/-1">
      <header><span class="accent"></span><h3>记录</h3><span class="extra">最近 40 条</span></header>
      <div class="body">${rows || '<div class="empty">还没有记录</div>'}</div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------- 记账 */
function vMoney() {
  const ex = D.expenses ?? {};
  const month = ex.month ?? {};
  const recent = ex.recent ?? [];
  const byCat = ex.byCategory ?? [];

  const pct = month.budget ? Math.min(100, Math.round((month.total / month.budget) * 100)) : 0;
  const avg = month.days_left != null ? (month.remaining / Math.max(month.days_left, 1)) : 0;

  const catRows = byCat.map((c) => `<div class="li">
    <span class="chip brand">${esc(c.category)}</span>
    <div class="grow"><span style="font-family:var(--mono);font-weight:700">¥${money(c.total)}</span>
      <span class="sub"> · ${c.n} 笔</span></div>
    <span class="sub" style="font-family:var(--mono)">${
      month.total ? Math.round((c.total / month.total) * 100) : 0
    }%</span>
  </div>`).join('');

  const rows = recent.map((e) => `<div class="li">
    <span class="chip plain">${esc(e.category)}</span>
    <div class="grow"><div>${esc(e.note || '(无说明)')}</div>
      <div class="sub">${e.when_text}</div></div>
    <span style="font-family:var(--mono);font-weight:700;flex:none">¥${money(e.amount)}</span>
    <div class="row-acts"><button class="btn ghost" data-act="ex-del" data-id="${e.id}">删</button></div>
  </div>`).join('');

  const today = new Date(Date.now() + BJ).toISOString().slice(0, 10);

  return `
  <div class="vhead"><h2>记账</h2>
    <span class="sub">本月 ¥${money(month.total)} / ¥${money(month.budget)}</span></div>
  <p class="vdesc">微信里发一句「午饭 14」就会自动记一笔，不用打开这个页面。</p>

  <div class="grid">
    <div class="card">
      <header><span class="accent"></span><h3>本月</h3>
        <span class="extra">剩 ${month.days_left ?? 0} 天</span></header>
      <div class="body pad">
        <div class="stats">
          <div class="stat hi"><div class="v">¥${money(month.total)}</div><div class="l">已花</div></div>
          <div class="stat"><div class="v">¥${money(month.today_total)}</div><div class="l">今天</div></div>
          <div class="stat"><div class="v">¥${money(avg)}</div><div class="l">每天可用</div></div>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="hint">预算 ¥${money(month.budget)} · 剩余 ¥${money(month.remaining)}</div>
      </div>
    </div>

    <div class="card">
      <header><span class="accent" style="background:var(--warm)"></span><h3>记一笔</h3></header>
      <div class="body pad">
        <div class="form">
          <input id="ex-amount" type="number" step="0.01" placeholder="金额，如 14" style="flex:1">
          <input id="ex-note" placeholder="说明，如 午饭" style="flex:2">
        </div>
        <div class="form" style="margin-top:9px">
          <select id="ex-cat" style="flex:1">
            <option>餐饮</option><option>交通</option><option>学习</option>
            <option>购物</option><option>娱乐</option><option>通讯</option><option>居住</option><option>其他</option>
          </select>
          <input id="ex-date" type="date" value="${today}" style="flex:1">
          <button class="btn pri" id="ex-add" style="flex:0 0 90px">记下</button>
        </div>
      </div>
    </div>

    <div class="card">
      <header><span class="accent" style="background:var(--muted)"></span><h3>分类</h3></header>
      <div class="body">${catRows || '<div class="empty">本月还没记账</div>'}</div>
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <header><span class="accent"></span><h3>最近</h3><span class="extra">最近 40 笔</span></header>
    <div class="body">${rows || '<div class="empty">还没有记录</div>'}</div>
  </div>`;
}

    return `<div class="vhead"><h2>报告</h2></div>

    <div class="card"><div class="body"><div class="empty">还没有生成过报告</div></div></div>`;

  return `

  ${rs.map((r) => {

/* ---------------------------------------------------------- 工作记忆 */
function vMemory() {
  const ms = D.memory ?? [];
  if (!ms.length) {
    return `<div class="vhead"><h2>工作记忆</h2></div>
    <p class="vdesc">电脑上每 30 分钟采集一次：AI 会话、浏览记录、最近改过的文件。</p>
    <div class="card"><div class="body"><div class="empty">还没有采集到东西</div></div></div>`;
  }

  return `
  <div class="vhead"><h2>工作记忆</h2><span class="sub">最近 ${ms.length} 天</span></div>
  <p class="vdesc">这些是早晚报里「你最近在忙什么」的依据。只采文件名、会话标题这类元信息，不传文件内容。</p>
  ${ms.map((m) => {
    const d = m.digest || {};
    const ai = (d.ai ?? []).slice(0, 4);
    const files = (d.files ?? []).slice(0, 8);
    const sites = (d.sites ?? []).slice(0, 8);
    return `<div class="card" style="margin-bottom:14px">
      <header><span class="accent"></span><h3>${m.memory_date}</h3>
        <span class="extra">${((m.source_bytes || 0) / 1024).toFixed(1)} KB</span></header>
      <div class="body pad">
        ${ai.length ? `<div class="sub" style="margin-bottom:7px"><b>AI 会话</b></div>` +
          ai.map((a) => `<div style="font-size:12.5px;margin-bottom:4px">· ${esc(typeof a === 'string' ? a : a.title || JSON.stringify(a))}</div>`).join('') : ''}
        ${sites.length ? `<div class="sub" style="margin:11px 0 7px"><b>浏览</b></div>
          <div style="font-size:12px;color:var(--muted);line-height:1.7">${
            sites.map((s) => esc(typeof s === 'string' ? s : s.title || s.url || '')).join(' · ')
          }</div>` : ''}
        ${files.length ? `<div class="sub" style="margin:11px 0 7px"><b>文件</b></div>
          <div style="font-size:12px;color:var(--muted);line-height:1.7">${
            files.map((f) => esc(typeof f === 'string' ? f : f.name || '')).join(' · ')
          }</div>` : ''}
      </div>
    </div>`;
  }).join('')}`;
}

function paintNav() {
  $('#nav').innerHTML = VIEWS.map(([k, n]) =>
    `<button data-v="${k}" class="${k === V ? 'on' : ''}">${n}</button>`).join('');
}

async function go(v) {
  V = v || 'overview';
  paintNav();
  $('#main').innerHTML = '<div id="loading"><span class="spin"></span> 读取中…</div>';
  try {
    D = await rpc('hub_data');
    if (!D) throw new Error('没拿到数据（可能是登录态失效）');
    render();
  } catch (e) {
    $('#main').innerHTML = `<div class="card"><div class="body pad">
      <div style="color:var(--hot);font-weight:600;margin-bottom:8px">读取失败</div>
      <div class="sub">${esc(e.message)}</div>
      <div class="hint">如果是「JWT expired」之类，退出重新登录一次。</div>
    </div></div>`;
  }
}

function render() {
  const p = D.profile ?? {};
  $('#top-meta').innerHTML =
    `${esc(p.display_name || '')}${D.weekNo ? ` · 第 ${D.weekNo} 周` : ''}<br>${D.today} ${WD_SHORT[D.weekday]}`;
  $('#main').innerHTML = (RENDER[V] || vOverview)();
  wire();
}

function wire() {
  const main = $('#main');

  main.querySelectorAll('[data-act]').forEach((b) => {
    b.addEventListener('click', async () => {
      const act = b.dataset.act, id = b.dataset.id;
      const done = b.dataset.done === 'true';
      b.disabled = true;
      try {
        if (act === 'tk-toggle') {
          await patch('tasks', `id=eq.${id}`, { done: !done, done_at: done ? null : new Date().toISOString() });
        } else if (act === 'dl-toggle' || act === 'dl-done') {
          await patch('deadlines', `id=eq.${id}`, {
            status: done ? 'open' : 'done', done_at: done ? null : new Date().toISOString() });
        } else if (act === 'tk-del') await del('tasks', `id=eq.${id}`);
        else if (act === 'dl-del') await del('deadlines', `id=eq.${id}`);
        else if (act === 'ex-del') await del('expenses', `id=eq.${id}`);
        else if (act === 'st-del') await del('study_logs', `id=eq.${id}`);
        toast('已更新');
        await go(V);
      } catch (e) {
        toast(e.message, true);
        b.disabled = false;
      }
    });
  });

  // --- 添加截止 ---
  $('#dl-add')?.addEventListener('click', async () => {
    const title = $('#dl-title').value.trim();
    const date = $('#dl-date').value;
    const time = $('#dl-time').value || '23:59';
    if (!title) return toast('写个标题', true);
    if (!date) return toast('选个日期', true);
    try {
      await insert('deadlines', {
        title, kind: 'homework',
        // 显式带 +08:00：不带时区的话服务端可能按 UTC 解释，整体差 8 小时
        due_at: new Date(`${date}T${time}:00+08:00`).toISOString(),
      });
      toast('已添加'); await go(V);
    } catch (e) { toast(e.message, true); }
  });

  // --- 添加待办 ---
  $('#tk-add')?.addEventListener('click', async () => {
    const title = $('#tk-title').value.trim();
    if (!title) return toast('写个标题', true);
    try {
      await insert('tasks', {
        title,
        due_date: $('#tk-date').value || null,
        priority: Number($('#tk-pri').value) || 2,
        source: 'manual',
      });
      toast('已添加'); await go(V);
    } catch (e) { toast(e.message, true); }
  });

  // --- 学习 ---
  $('#st-add')?.addEventListener('click', async () => {
    const m = Number($('#st-min').value);
    if (!m || m <= 0) return toast('填分钟数', true);
    if (m > 1440) return toast('一天不可能超过 1440 分钟', true);
    try { await insert('study_logs', { kind: 'study', minutes: m }); toast(`记下 ${m} 分钟`); await go(V); }
    catch (e) { toast(e.message, true); }
  });
  $('#sw-add')?.addEventListener('click', async () => {
    const c = Number($('#sw-count').value);
    if (!c || c <= 0) return toast('填单词数', true);
    try {
      await insert('study_logs', { kind: 'words', count: c, note: $('#sw-note').value.trim() || null });
      toast(`记下 ${c} 个单词`); await go(V);
    } catch (e) { toast(e.message, true); }
  });

  // --- 记账 ---
  $('#ex-add')?.addEventListener('click', async () => {
    const amt = Number($('#ex-amount').value);
    if (!amt || amt <= 0) return toast('填金额', true);
    const date = $('#ex-date').value;
    try {
      await insert('expenses', {
        amount: amt,
        category: $('#ex-cat').value,
        note: $('#ex-note').value.trim() || null,
        spent_at: date ? new Date(`${date}T12:00:00+08:00`).toISOString() : new Date().toISOString(),
      });
      toast('已记账'); await go(V);
    } catch (e) { toast(e.message, true); }
  });

  // --- 设置 ---
  const saveProfile = (row, label) => async () => {
    try { await patch('profiles', `id=eq.${userId}`, row); toast(label); await go(V); }
    catch (e) { toast(e.message, true); }
  };
  $('#s-save-push')?.addEventListener('click', saveProfile({
    morning_report_at: $('#s-morning').value || '07:00',
    evening_report_at: $('#s-evening').value || '22:30',
    push_enabled: $('#s-push').checked,
  }, '推送设置已保存'));
  $('#s-save-goal')?.addEventListener('click', saveProfile({
    monthly_budget: Number($('#s-budget').value) || 1500,
    weekly_study_goal_minutes: Number($('#s-week').value) || 840,
    daily_word_goal: Number($('#s-words').value) || 50,
  }, '目标已保存'));
  $('#s-save-term')?.addEventListener('click', saveProfile({
    term_start_date: $('#s-term').value || null,
    term_weeks: Number($('#s-weeks').value) || 20,
  }, '学期设置已保存'));

  $('#logout')?.addEventListener('click', () => { saveSession(null); location.reload(); });

  $('#nav').querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => go(b.dataset.v));
  });
}

let userId = null;

/* ===========================================================================
   启动
   =========================================================================== */
(async function boot() {
  if (!S) return;                       // 停在登录页

  try {
    // 先确认登录态还有效，再显示主界面（避免闪一下又跳回来）
    const token = await ensureToken();
    const payload = JSON.parse(atob(token.split('.')[1]));
    userId = payload.sub;

    $('#login').style.display = 'none';
    $('#app').style.display = 'block';
    paintNav();
    await go('overview');
  } catch (e) {
    saveSession(null);
    $('#login').style.display = 'grid';
    $('#app').style.display = 'none';
    $('#login-err').textContent = e.message;
    $('#login-err').classList.add('on');
  }
})();

$('#do-login').addEventListener('click', async () => {
  const btn = $('#do-login'), err = $('#login-err');
  const email = $('#email').value.trim(), pw = $('#password').value;
  err.classList.remove('on');
  if (!email || !pw) { err.textContent = '邮箱和密码都要填'; err.classList.add('on'); return; }
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    await doLogin(email, pw);
    location.reload();
  } catch (e) {
    err.textContent = e.message; err.classList.add('on');
    btn.disabled = false; btn.textContent = '登录';
  }
});
$('#password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#do-login').click(); });
$('#email').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#password').focus(); });
</script>
