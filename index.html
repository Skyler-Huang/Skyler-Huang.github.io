    <style>
        /* ============================================================================
           设计令牌（Design Tokens）——全站唯一视觉来源
           视觉概念：金融编辑体（Financial Editorial）
             · 麦肯锡式的信息纪律 + 彭博社式的数据密度 + 财新式的编辑克制
             · 账簿母题：发丝分隔线、等宽数字、编号索引
           视觉来源模式：项目推断模式（用户未指定品牌规范/参考图）
           所有颜色对比度均按 WCAG AA 校验（正文 ≥4.5:1，大字 ≥3:1）
           ============================================================================ */
        :root {
            /* ---------- 色彩系统：纸 / 墨 / 铁蓝 / 赭金 ---------- */
            --paper: #FBFAF8;
            --surface: #FFFFFF;
            --surface-2: #FAF8F5;
            --surface-3: #F1EEE8;

            --ink: #12171C;
            --ink-2: #2C343B;
            --ink-3: #4D565F;
            --ink-4: #656D76;

            --rule: #E4E0D9;
            --rule-strong: #CFC9BF;

            --navy: #1F4463;
            --navy-deep: #0F293D;

            --ochre: #96682A;

            --success: #2E6349;
            --warning: #8A6520;
            --error: #93312C;
            --info: #2B5273;

            /* ---------- 兼容别名：旧页面与既有组件沿用这些名字，统一指向新令牌 ----------
               新页面请直接使用上方的规范令牌；迁移期间这些别名保证全站视觉同源。 */
            --bg: var(--paper);
            --card-bg: var(--surface);
            --primary: var(--navy);
            --accent: var(--ochre);
            --text: var(--ink-2);
            --text-dark: var(--ink);
            --text-light: var(--ink-4);
            --gray-placeholder: var(--surface-3);
            --hover-bg: var(--surface-2);

            /* ---------- 字阶：克制，不随视口线性缩放 ---------- */
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif;
            --font-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia,
                'Times New Roman', 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', serif;
            --font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas,
                'Liberation Mono', 'Courier New', monospace;

            --fs-h1: 2.625rem;   /* 42px 姓名 */
            --fs-h2: 1.375rem;   /* 22px 区块标题 */
            --fs-h3: 1.0625rem;  /* 17px 卡片标题 */
            --fs-body: 1rem;     /* 16px 正文 */
            --fs-sm: 0.875rem;   /* 14px 辅助 */
            --fs-xs: 0.75rem;    /* 12px 标签/等宽 */

            /* ---------- 间距刻度：8px 节奏 ---------- */
            --s-1: 4px;
            --s-2: 8px;
            --s-3: 16px;
            --s-4: 24px;
            --s-5: 32px;
            --s-6: 48px;
            --s-7: 64px;
            --s-8: 96px;

            /* ---------- 形状 ---------- */
            --radius: 4px;
            --radius-sm: 2px;

            /* ---------- 层级阴影：方向统一（自上而下），透明度低 ---------- */
            --shadow-sm: 0 1px 2px rgba(18, 23, 28, 0.04);
            --shadow-md: 0 6px 20px rgba(18, 23, 28, 0.07);

            /* ---------- 动效曲线：短、统一、有意义 ---------- */
            --ease: cubic-bezier(0.2, 0.6, 0.2, 1);
            --transition-fast: 120ms var(--ease);
            --transition-normal: 200ms var(--ease);
            --transition-slow: 420ms var(--ease);

            /* ---------- 版心与节奏 ---------- */
            --max-width: 1128px;
            --nav-height: 72px;
            --gutter: 24px;
        }

        /* ============================================================================
           1. 基础层（Reset / 排版基线）
           ============================================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background-color: var(--paper);
            background-image: linear-gradient(180deg, var(--surface) 0%, var(--paper) 420px);
            background-repeat: no-repeat;
            color: var(--ink-2);
            font-family: var(--font-sans);
            font-size: var(--fs-body);
            line-height: 1.75;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            min-height: 100vh;
            padding-top: var(--nav-height);
            overflow-x: hidden;
        }

        a {
            color: var(--navy);
        }

        ::selection {
            background-color: var(--navy);
            color: #fff;
        }

        /* 可见焦点环：键盘可达性的硬性门槛 */
        :focus-visible {
            outline: 2px solid var(--navy);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }

        /* 跳至主内容（键盘用户第一个 Tab 即可见） */
        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            z-index: 2000;
            display: inline-block;
            padding: 10px 18px;
            background-color: var(--navy);
            color: #fff;
            font-size: var(--fs-sm);
            text-decoration: none;
            border-radius: 0 0 var(--radius) 0;
        }

        .skip-link:focus {
            left: 0;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes navFadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes ruleGrow {
            from { transform: scaleX(0); }
            to   { transform: scaleX(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ============================================================================
           2. 首页报头（Masthead）——出版物式的刊头带
           ============================================================================ */
        .masthead {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--s-4) var(--gutter) 0;
        }

        .masthead-rule {
            display: flex;
            align-items: center;
            gap: var(--s-3);
            padding-bottom: var(--s-3);
            border-bottom: 1px solid var(--rule);
        }

        .masthead-mark {
            font-family: var(--font-mono);
            font-size: var(--fs-xs);
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink);
            white-space: nowrap;
        }

        .masthead-line {
            flex: 1;
            height: 1px;
            background-color: var(--rule);
        }

        .masthead-meta {
            font-family: var(--font-mono);
            font-size: var(--fs-xs);
            letter-spacing: 0.1em;
            color: var(--ink-4);
            white-space: nowrap;
        }

        /* ============================================================================
           3. 头部 / 主视觉（Hero）
           ============================================================================ */
        .header {
            position: relative;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: var(--s-6) var(--gutter) var(--s-4);
        }

        .header-inner {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
            position: relative;
        }

        /* 利用 flex order 调整视觉顺序，不改变任何 DOM / JS 选择器 */
        .header-inner .avatar-badge { order: 1; }
        .header-inner .header-english-name { order: 2; }
        .header-inner .header-name { order: 3; }
        .header-inner .header-tagline { order: 4; }
        .header-inner .header-quote { order: 5; }
        .header-inner .header-github { order: 6; }

        .avatar-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: var(--radius);
            border: 1px solid var(--navy);
            background-color: transparent;
            color: var(--navy);
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.02em;
            margin-bottom: var(--s-4);
            user-select: none;
            flex-shrink: 0;
            animation: fadeInUp var(--transition-slow) var(--ease) both;
        }

        .header-english-name {
            font-family: var(--font-mono);
            font-size: var(--fs-xs);
            font-weight: 500;
            line-height: 1;
            color: var(--ochre);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-bottom: var(--s-2);
            animation: fadeInUp var(--transition-slow) var(--ease) both;
            animation-delay: 60ms;
        }

        .header-name {
            font-family: var(--font-serif);
            font-size: var(--fs-h1);
            font-weight: 600;
            line-height: 1.12;
            letter-spacing: -0.012em;
            color: var(--ink);
            max-width: 20ch;
            animation: fadeInUp var(--transition-slow) var(--ease) both;
            animation-delay: 120ms;
        }

        .header-tagline {
            font-size: var(--fs-body);
            font-weight: 400;
            line-height: 1.6;
            color: var(--ink-3);
            letter-spacing: 0.01em;
            max-width: 46ch;
            margin-top: var(--s-3);
            animation: fadeInUp var(--transition-slow) var(--ease) both;
            animation-delay: 180ms;
        }

        /* 随机金句：以「引言」组件呈现，是全页唯一使用赭金的强调块 */
        .header-quote {
            position: relative;
            margin-top: var(--s-5);
            padding: var(--s-1) 0 var(--s-1) var(--s-4);
            max-width: 40ch;
            font-family: var(--font-serif);
            font-size: 1.1875rem;
            font-style: normal;
            line-height: 1.6;
            color: var(--ink-2);
            letter-spacing: 0.01em;
            animation: fadeInUp var(--transition-slow) var(--ease) both;
            animation-delay: 240ms;
        }

        .header-quote::before {
            content: '';
            position: absolute;
            left: 0;
            top: 2px;
            bottom: 2px;
            width: 2px;
            background-color: var(--ochre);
        }

        .header-github {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: var(--s-5);
            padding: var(--s-2) 0;
            font-size: var(--fs-sm);
            font-weight: 500;
            color: var(--ink-3);
            text-decoration: none;
            letter-spacing: 0.02em;
            border-bottom: 1px solid var(--rule-strong);
            transition: color var(--transition-fast), border-color var(--transition-fast);
            animation: fadeInUp var(--transition-slow) var(--ease) both;
            animation-delay: 300ms;
        }

        .header-github:hover {
            color: var(--navy);
            border-bottom-color: var(--navy);
        }

        .header-github svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* 专业聚焦标签 */
        .header-focus {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--s-1) var(--s-3);
            margin-top: var(--s-4);
            font-family: var(--font-mono);
            font-size: var(--fs-xs);
            letter-spacing: 0.06em;
            color: var(--ink-4);
            list-style: none;
            animation: fadeInUp var(--transition-slow) var(--ease) both;
            animation-delay: 90ms;
        }

        .header-focus > span {
            display: inline-flex;
            align-items: center;
            gap: var(--s-1) var(--s-3);
        }

        .header-focus > span + span::before {
            content: '';
            width: 3px;
            height: 3px;
            margin-right: var(--s-2);
            background-color: var(--rule-strong);
            border-radius: 50%;
        }

        /* ============================================================================
           4. 天气模块（结构由既有脚本填充：w-text / is-muted / w-icon / w-city / w-cond / w-temp / w-sep）
           ============================================================================ */
        .weather-widget {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--s-2);
            margin-top: var(--s-4);
            padding: 10px var(--s-3);
            background-color: var(--surface);
            border: 1px solid var(--rule);
            border-left: 2px solid var(--navy);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            font-family: var(--font-sans);
            font-size: var(--fs-sm);
            color: var(--ink-2);
            letter-spacing: 0.01em;
            max-width: 100%;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            animation: fadeInUp var(--transition-slow) var(--ease) both;
            animation-delay: 150ms;
        }

        .weather-widget:hover {
            border-color: var(--rule-strong);
            border-left-color: var(--navy);
        }

        .weather-widget::before {
            content: '天气';
            font-family: var(--font-mono);
            font-size: var(--fs-xs);
            letter-spacing: 0.1em;
            color: var(--ink-4);
            padding-right: var(--s-2);
            border-right: 1px solid var(--rule);
            flex-shrink: 0;
        }

        .weather-widget .w-icon {
            font-size: 1rem;
            line-height: 1;
        }

        .weather-widget .w-city {
            color: var(--ink);
            font-weight: 600;
        }

        .weather-widget .w-cond {
            color: var(--ink-3);
        }

        .weather-widget .w-temp {
            color: var(--navy);
            font-family: var(--font-mono);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0;
        }

        .weather-widget .w-sep {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background-color: var(--rule-strong);
            flex-shrink: 0;
        }

        /* 加载中 / 失败等静默状态：不报错、不红屏 */
        .weather-widget.is-muted {
            color: var(--ink-4);
            font-style: normal;
            border-left-color: var(--rule-strong);
        }

        .header-divider {
            max-width: var(--max-width);
            margin: var(--s-5) 0 0;
            height: 1px;
            background-color: var(--rule-strong);
            border: none;
        }

        /* ============================================================================
           5. 主导航
           ============================================================================ */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(251, 250, 248, 0);
            border-bottom: 1px solid transparent;
            transition: background-color var(--transition-normal), border-color var(--transition-normal);
            animation: navFadeIn var(--transition-slow) var(--ease) both;
            animation-delay: 40ms;
        }

        .nav-bar.scrolled {
            background-color: rgba(251, 250, 248, 0.94);
            backdrop-filter: blur(12px) saturate(1.4);
            -webkit-backdrop-filter: blur(12px) saturate(1.4);
            border-bottom-color: var(--rule);
        }

        .nav-inner {
            max-width: var(--max-width);
            width: 100%;
            padding: 0 var(--gutter);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 0;
            position: relative;
        }
        .nav-item {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px var(--s-3);
            font-size: var(--fs-sm);
            font-weight: 500;
            color: var(--ink-2);
            cursor: pointer;
            border-radius: var(--radius-sm);
            text-decoration: none;
            white-space: nowrap;
            letter-spacing: 0.04em;
            transition: color var(--transition-fast), background-color var(--transition-fast);
            user-select: none;
        }

        .nav-item:hover {
            color: var(--navy);
            background-color: var(--surface-2);
        }

        /* 当前所在位置：颜色 + 位置双重表达，不单靠颜色 */
        .nav-item.active {
            color: var(--ink);
            font-weight: 600;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            left: var(--s-3);
            right: var(--s-3);
            bottom: 4px;
            height: 2px;
            background-color: currentColor;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform var(--transition-normal);
        }

        .nav-item:hover::after {
            transform: scaleX(1);
        }

        .nav-item.active::after {
            transform: scaleX(1);
            background-color: var(--navy);
        }

        .nav-arrow {
            display: inline-block;
            font-size: 0.6em;
            line-height: 1;
            color: var(--ink-4);
            transform: translateY(1px);
            transition: transform var(--transition-normal), color var(--transition-fast);
        }

        .nav-item:hover .nav-arrow {
            color: var(--navy);
        }

        .nav-item.dropdown-open .nav-arrow {
            transform: translateY(1px) rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background-color: var(--surface);
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            min-width: 208px;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height var(--transition-normal), opacity var(--transition-normal), transform var(--transition-normal);
            z-index: 1001;
            pointer-events: none;
            list-style: none;
            padding: 0;
        }

        .dropdown-menu.open {
            max-height: 420px;
            opacity: 1;
            transform: translateX(-50%) translateY(4px);
            pointer-events: auto;
        }

        .dropdown-menu a {
            display: block;
            padding: 10px var(--s-3);
            font-size: var(--fs-sm);
            color: var(--ink-2);
            text-decoration: none;
            letter-spacing: 0.02em;
            border-bottom: 1px solid var(--rule);
            transition: background-color var(--transition-fast), color var(--transition-fast), padding-left var(--transition-fast);
        }

        .dropdown-menu a:last-child {
            border-bottom: none;
        }

        .dropdown-menu a:hover {
            background-color: var(--surface-2);
            color: var(--navy);
            padding-left: 20px;
        }

        .hamburger-btn {
            display: none;
            background: none;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            padding: 10px;
            flex-direction: column;
            gap: 5px;
            z-index: 1002;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            transition: border-color var(--transition-fast);
        }

        .hamburger-btn:hover {
            border-color: var(--rule);
        }

        .hamburger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--ink);
            border-radius: 1px;
            transition: transform var(--transition-normal), opacity var(--transition-normal);
        }

        .hamburger-btn.open span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .hamburger-btn.open span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-btn.open span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* ============================================================================
           6. 阅读进度与返回顶部
           ============================================================================ */
        .progress-bar {
            position: fixed;
            top: var(--nav-height);
            left: 0;
            width: 100%;
            height: 2px;
            z-index: 999;
            background-color: transparent;

        .back-to-top {
            position: fixed;

            right: var(--s-4);

        /* ============================================================================
           7. 主内容区
           ============================================================================ */
        .main-container {

            counter-reset: section block;

        .section-block {
            counter-increment: section;
            margin-top: var(--s-7);

            transform: translateY(0);

        .section-block:first-child {

        .section-heading {
            position: relative;
            display: flex;
            align-items: baseline;
            gap: var(--s-3);

        .section-heading::before {

            content: counter(block, decimal-leading-zero);

            font-size: var(--fs-xs);

        .card-grid {

        .card {

            right: var(--s-3);

            font-size: var(--fs-h3);

            padding-right: var(--s-6);

    <script>
        (function() {

            // ========== 渲染头部 ==========
            function renderHeader() {
                var headerInner = document.querySelector('#header .header-inner');
                if (!headerInner) return;
                headerInner.innerHTML = '';

                var d = siteData.header;

                var avatar = document.createElement('div');
                avatar.className = 'avatar-badge';
                avatar.setAttribute('aria-label', d.englishName + ' 头像徽标');
                avatar.textContent = d.avatarLetter;
                headerInner.appendChild(avatar);

                var h1 = document.createElement('h1');
                h1.className = 'header-name';
                h1.textContent = d.name;
                headerInner.appendChild(h1);

                var pEn = document.createElement('p');
                pEn.className = 'header-english-name';
                pEn.textContent = d.englishName;
                headerInner.appendChild(pEn);

                if (siteData.quotes && siteData.quotes.length > 0) {
                    var pQuote = document.createElement('p');
                    pQuote.className = 'header-quote';
                    var randomIndex = Math.floor(Math.random() * siteData.quotes.length);
                    pQuote.textContent = siteData.quotes[randomIndex];
                    headerInner.appendChild(pQuote);
                }

                var pTag = document.createElement('p');
                pTag.className = 'header-tagline';
                pTag.textContent = d.tagline;
                headerInner.appendChild(pTag);

                var ghLink = document.createElement('a');
                ghLink.href = d.githubUrl;
                ghLink.className = 'header-github';
                ghLink.target = '_blank';
                ghLink.rel = 'noopener noreferrer';
                ghLink.setAttribute('aria-label', 'GitHub 主页');
                ghLink.innerHTML = '<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.385-1.335-1.755-1.335-1.755-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.605-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 21.795 24 17.295 24 12c0-6.63-5.37-12-12-12z"/></svg><span>GitHub</span>';
                headerInner.appendChild(ghLink);
            }

            // ========== 渲染导航 ==========
            function renderNavigation() {
                var navLinks = document.getElementById('navLinks');
                var navBar = document.getElementById('navBar');
                if (!navLinks || !navBar) return;

                navLinks.innerHTML = '';

                // 移除旧下拉菜单
                var oldDropdowns = navBar.querySelectorAll('.dropdown-menu');
                oldDropdowns.forEach(function(dd) { dd.remove(); });

                var dropdownIdx = 0;

                siteData.navigation.items.forEach(function(item) {
                    if (item.hasDropdown) {
                        var dropdownId = 'dropdown-' + dropdownIdx;

                        var navItem = document.createElement('span');
                        navItem.className = 'nav-item';
                        navItem.setAttribute('data-has-dropdown', 'true');
                        navItem.setAttribute('data-dropdown', dropdownId);
                        navItem.setAttribute('role', 'button');
                        navItem.setAttribute('tabindex', '0');
                        navItem.setAttribute('aria-expanded', 'false');
                        navItem.innerHTML = item.label + ' <span class="nav-arrow">▼</span>';
                        navLinks.appendChild(navItem);

                        var menu = document.createElement('div');
                        menu.className = 'dropdown-menu';
                        menu.id = dropdownId;
                        menu.setAttribute('aria-label', item.label + '子菜单');
                        item.dropdown.forEach(function(sub) {
                            var a = document.createElement('a');
                            a.href = sub.href;
                            a.textContent = sub.label;
                            menu.appendChild(a);
                        });
                        navBar.appendChild(menu);

                        dropdownIdx++;
                    } else {
                        var navItem = document.createElement('a');
                        navItem.className = 'nav-item';
                        navItem.href = item.href || '/';
                        navItem.setAttribute('data-has-dropdown', 'false');
                        if (item.isActive) {
                            navItem.classList.add('active');
                        }
                        navItem.textContent = item.label;
                        navLinks.appendChild(navItem);
                    }
                });
            }

            // ========== 渲染分类区域 ==========
            function renderSections() {
                var main = document.getElementById('mainContainer');
                if (!main) return;

                siteData.categories.forEach(function(cat) {
                    var section = document.createElement('section');
                    section.className = 'section-block';
                    section.id = 'section-' + cat.id;
                    section.setAttribute('aria-labelledby', 'heading-' + cat.id);

                    var heading = document.createElement('h2');
                    heading.className = 'section-heading';
                    heading.id = 'heading-' + cat.id;
                    heading.textContent = cat.title;
                    section.appendChild(heading);

                    var grid = document.createElement('div');
                    grid.className = 'card-grid';
                    grid.id = 'cardGrid-' + cat.id;
                    section.appendChild(grid);

                    var placeholder = document.createElement('div');
                    placeholder.className = 'placeholder-block';
                    placeholder.setAttribute('data-placeholder', '');
                    placeholder.textContent = cat.placeholder;
                    section.appendChild(placeholder);

                    main.appendChild(section);
                });
            }

            // ========== 渲染单张卡片 ==========
            function renderCard(card) {
                var cardEl = document.createElement(card.link ? 'a' : 'div');
                cardEl.className = 'card';
                cardEl.setAttribute('data-card', '');

                if (card.link) {
                    cardEl.href = card.link;
                }

                if (card.accent) {
                    cardEl.style.borderLeftColor = 'var(--accent)';
                    cardEl.style.cursor = 'default';
                }

                var titleEl = document.createElement('span');
                titleEl.className = 'card-title';
                titleEl.textContent = card.title;
                cardEl.appendChild(titleEl);

                var descEl = document.createElement('span');
                descEl.className = 'card-desc';
                descEl.textContent = card.description;
                cardEl.appendChild(descEl);

                if (card.email || card.phone) {
                    var contactDiv = document.createElement('div');
                    contactDiv.style.cssText = 'margin-top: 8px;';

                    if (card.email) {
                        var emailLink = document.createElement('a');
                        emailLink.href = 'mailto:' + card.email;
                        emailLink.className = 'card-contact-link';
                        emailLink.textContent = '📧 ' + card.email;
                        contactDiv.appendChild(emailLink);
                    }

                    if (card.phone) {
                        var phoneLink = document.createElement('a');
                        phoneLink.href = 'tel:' + card.phone;
                        phoneLink.className = 'card-contact-link';
                        phoneLink.textContent = '📞 ' + card.phone;
                        contactDiv.appendChild(phoneLink);
                    }

                    cardEl.appendChild(contactDiv);
                }

                return cardEl;
            }

            // ========== 渲染所有卡片 ==========
            function renderAllCards() {
                siteData.categories.forEach(function(cat) {
                    var gridEl = document.getElementById('cardGrid-' + cat.id);
                    if (!gridEl) return;
                    gridEl.innerHTML = '';
                    cat.cards.forEach(function(card) {
                        gridEl.appendChild(renderCard(card));
                    });
                });
            }

            // ========== 渲染自我介绍 ==========
            function renderSelfIntro() {
                var main = document.getElementById('mainContainer');
                if (!main) return;

                var section = document.createElement('section');
                section.className = 'self-intro';
                section.id = 'selfIntro';
                section.setAttribute('aria-labelledby', 'heading-intro');

                siteData.about.forEach(function(text) {
                    var p = document.createElement('p');
                    p.textContent = text;
                    section.appendChild(p);
                });

                main.appendChild(section);
            }

            // ========== 渲染底部 ==========
            function renderFooter() {
                var footer = document.getElementById('footer');
                if (!footer) return;
                footer.innerHTML = '';

                var f = siteData.footer;

                var p1 = document.createElement('p');
                p1.innerHTML = f.copyright + ' · <span class="footer-domain">' + f.domain + '</span>';
                footer.appendChild(p1);

                var p2 = document.createElement('p');
                p2.textContent = f.powered;
                footer.appendChild(p2);

                var p3 = document.createElement('p');
                p3.className = 'footer-note';
                p3.textContent = f.note;
                footer.appendChild(p3);

                if (f.lastUpdated) {
                    var p4 = document.createElement('p');
                    p4.className = 'footer-updated';
                    p4.textContent = '最后更新：' + f.lastUpdated;
                    footer.appendChild(p4);
                }
            }

            // ========== 更新页面标题 ==========
            // 说明：<title> / description / keywords / OG 等标签在 <head> 中静态维护（含 SEO/GEO 优化）。
            // 此处仅用 siteData.header.pageTitle 同步 document.title，不再覆盖 meta description。
            function updatePageTitle() {
                var d = siteData.header;
                if (d.pageTitle) {
                    document.title = d.pageTitle;
                }
            }

            // ========== 执行所有渲染 ==========
            updatePageTitle();
            renderHeader();
            renderNavigation();
            renderSections();
            renderAllCards();
            renderSelfIntro();
            renderFooter();

            // ========== DOM 引用（渲染后获取） ==========
            var navBar = document.getElementById('navBar');
            var hamburgerBtn = document.getElementById('hamburgerBtn');
            var navLinks = document.getElementById('navLinks');
            var allNavItems = navLinks.querySelectorAll('.nav-item[data-has-dropdown="true"]');
            var allDropdowns = document.querySelectorAll('.dropdown-menu');
            var sectionBlocks = document.querySelectorAll('.section-block');
            var selfIntro = document.getElementById('selfIntro');
            var footer = document.getElementById('footer');

            var progressBarFill = document.getElementById('progressBarFill');
            var backToTopBtn = document.getElementById('backToTop');

            var openDropdownId = null;
            var isMobileOpen = false;

            // ========== 滚动：导航栏样式 + 进度条 + 返回顶部 ==========
            function handleScroll() {
                if (window.scrollY > 100) {
                    navBar.classList.add('scrolled');
                } else {
                    navBar.classList.remove('scrolled');
                }

                if (progressBarFill) {
                    var scrollTop = window.scrollY || document.documentElement.scrollTop;
                    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
                    var progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
                    if (progress > 100) progress = 100;
                    if (progress < 0) progress = 0;
                    progressBarFill.style.width = progress + '%';
                }

                if (backToTopBtn) {
                    if (window.scrollY > 400) {
                        backToTopBtn.classList.add('visible');
                    } else {
                        backToTopBtn.classList.remove('visible');
                    }
                }
            }

            window.addEventListener('scroll', handleScroll, { passive: true });
            handleScroll();

            if (backToTopBtn) {
                backToTopBtn.addEventListener('click', function() {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            // ========== 下拉菜单逻辑 ==========
            function closeAllDropdowns() {
                allDropdowns.forEach(function(dd) { dd.classList.remove('open'); });
                allNavItems.forEach(function(item) {
                    item.classList.remove('dropdown-open');
                    item.setAttribute('aria-expanded', 'false');
                });
                openDropdownId = null;
            }

            function openDropdown(dropdownId, navItem) {
                closeAllDropdowns();
                var dropdown = document.getElementById(dropdownId);
                if (dropdown) {
                    dropdown.classList.add('open');
                    if (navItem) {
                        navItem.classList.add('dropdown-open');
                        navItem.setAttribute('aria-expanded', 'true');
                    }
                    openDropdownId = dropdownId;
                }
            }

            function toggleDropdown(dropdownId, navItem) {
                if (openDropdownId === dropdownId) {
                    closeAllDropdowns();
                } else {
                    openDropdown(dropdownId, navItem);
                }
            }

            allNavItems.forEach(function(navItem) {
                navItem.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var dropdownId = navItem.getAttribute('data-dropdown');
                    toggleDropdown(dropdownId, navItem);
                });
                navItem.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        var dropdownId = navItem.getAttribute('data-dropdown');
                        toggleDropdown(dropdownId, navItem);
                    }
                });
            });

            document.addEventListener('click', function(e) {
                var inside = e.target.closest('.nav-item') || e.target.closest('.dropdown-menu');
                if (!inside) {
                    closeAllDropdowns();
                }
            });

            allDropdowns.forEach(function(dd) {
                dd.addEventListener('click', function(e) {
                    if (e.target.tagName === 'A') {
                        closeAllDropdowns();
                        if (isMobileOpen) closeMobileNav();
                    }
                });
            });

            // ========== 移动端汉堡菜单 ==========
            function openMobileNav() {
                isMobileOpen = true;
                navLinks.classList.add('open');
                hamburgerBtn.classList.add('open');
                hamburgerBtn.setAttribute('aria-expanded', 'true');
                hamburgerBtn.setAttribute('aria-label', '关闭菜单');
            }

            function closeMobileNav() {
                isMobileOpen = false;
                navLinks.classList.remove('open');
                hamburgerBtn.classList.remove('open');
                hamburgerBtn.setAttribute('aria-expanded', 'false');
                hamburgerBtn.setAttribute('aria-label', '打开菜单');
                closeAllDropdowns();
            }

            function toggleMobileNav() {
                if (isMobileOpen) { closeMobileNav(); } else { openMobileNav(); }
            }

            hamburgerBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleMobileNav();
            });

            document.addEventListener('click', function(e) {
                if (isMobileOpen &&
                    !e.target.closest('#navLinks') &&
                    !e.target.closest('#hamburgerBtn') &&
                    !e.target.closest('.dropdown-menu')) {
                    closeMobileNav();
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 600 && isMobileOpen) {
                    closeMobileNav();
                }
            });

            // ========== Intersection Observer：滚动动画 ==========
            var observerOptions = {
                root: null,
                rootMargin: '0px 0px -40px 0px',
                threshold: 0.12
            };

            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        var target = entry.target;

                        if (target.classList.contains('section-block')) {
                            target.classList.add('visible');
                            var cardsInSection = target.querySelectorAll('[data-card]');
                            cardsInSection.forEach(function(card, index) {
                                setTimeout(function() {
                                    card.classList.add('visible');
                                }, index * 80);
                            });
                            var placeholder = target.querySelector('[data-placeholder]');
                            if (placeholder) {
                                setTimeout(function() {
                                    placeholder.classList.add('visible');
                                }, cardsInSection.length * 80 + 50);
                            }
                            observer.unobserve(target);
                        }

                        if (target === selfIntro) {
                            target.classList.add('visible');
                            observer.unobserve(target);
                        }

                        if (target === footer) {
                            target.classList.add('visible');
                            observer.unobserve(target);
                        }
                    }
                });
            }, observerOptions);

            sectionBlocks.forEach(function(section) { observer.observe(section); });
            if (selfIntro) observer.observe(selfIntro);
            if (footer) observer.observe(footer);

            // ========== 页面加载后触发已可见区域 ==========
            function triggerVisibleOnLoad() {
                var allObservables = [].slice.call(sectionBlocks);
                if (selfIntro) allObservables.push(selfIntro);
                if (footer) allObservables.push(footer);

                allObservables.forEach(function(el) {
                    var rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight && rect.bottom > 0) {
                        if (el.classList.contains('section-block') && !el.classList.contains('visible')) {
                            el.classList.add('visible');
                            var cardsInSection = el.querySelectorAll('[data-card]');
                            cardsInSection.forEach(function(card, index) {
                                setTimeout(function() {
                                    card.classList.add('visible');
                                }, index * 80);
                            });
                            var placeholder = el.querySelector('[data-placeholder]');
                            if (placeholder) {
                                setTimeout(function() {
                                    placeholder.classList.add('visible');
                                }, cardsInSection.length * 80 + 50);
                            }
                            observer.unobserve(el);
                        }
                        if (el === selfIntro && !el.classList.contains('visible')) {
                            el.classList.add('visible');
                            observer.unobserve(el);
                        }
                        if (el === footer && !el.classList.contains('visible')) {
                            el.classList.add('visible');
                            observer.unobserve(el);
                        }
                    }
                });
            }

            setTimeout(triggerVisibleOnLoad, 800);

            // ========== Escape 关闭 ==========
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeAllDropdowns();
                    if (isMobileOpen) closeMobileNav();
                }
            });

            console.log('📖 hletian.cn — 个人数字据点已就绪');
            console.log('   风格：旧式账簿 / 极简信笺');
            console.log('   黄乐天 · Skyler · 会计学专业');
        })();
    </script>

    <!-- ==================== 天气模块脚本 ==================== -->
    <script>
        (function () {
            var widget = document.getElementById('weatherWidget');
            if (!widget) return;

            // WMO 天气代码 → [中文描述, emoji]
            var WMO = {
                0:  ['晴', '☀️'],
                1:  ['晴间多云', '🌤️'],
                2:  ['多云', '⛅'],
                3:  ['阴', '☁️'],
                45: ['雾', '🌫️'],
                48: ['雾凇', '🌫️'],
                51: ['毛毛雨', '🌦️'],
                53: ['毛毛雨', '🌦️'],
                55: ['毛毛雨', '🌦️'],
                56: ['冻毛毛雨', '🌧️'],
                57: ['冻毛毛雨', '🌧️'],
                61: ['小雨', '🌧️'],
                63: ['中雨', '🌧️'],
                65: ['大雨', '🌧️'],
                66: ['冻雨', '🌧️'],
                67: ['冻雨', '🌧️'],
                71: ['小雪', '🌨️'],
                73: ['中雪', '🌨️'],
                75: ['大雪', '🌨️'],
                77: ['雪粒', '🌨️'],
                80: ['阵雨', '🌦️'],
                81: ['阵雨', '🌦️'],
                82: ['强阵雨', '⛈️'],
                85: ['阵雪', '🌨️'],
                86: ['强阵雪', '🌨️'],
                95: ['雷阵雨', '⛈️'],
                96: ['雷阵雨伴冰雹', '⛈️'],
                99: ['雷阵雨伴冰雹', '⛈️']
            };

            function decodeWMO(code) {
                var m = WMO[code];
                return m ? { text: m[0], emoji: m[1] } : { text: '未知', emoji: '🌡️' };
            }

            function setWeather(city, text, emoji, temp) {
                widget.classList.remove('is-muted');
                widget.innerHTML =
                    '<span class="w-icon">' + emoji + '</span>' +
                    '<span class="w-city">' + city + '</span>' +
                    '<span class="w-sep"></span>' +
                    '<span class="w-cond">' + text + '</span>' +
                    '<span class="w-sep"></span>' +
                    '<span class="w-temp">' + temp + '°C</span>';
            }

            function setMuted(msg) {
                widget.classList.add('is-muted');
                widget.innerHTML = '<span class="w-text">' + msg + '</span>';
            }

            var DEFAULT = { lat: 30.59, lon: 114.30, name: '武汉' };

            function fetchWeather(lat, lon, cityName) {
                var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat +
                    '&longitude=' + lon + '&current=temperature_2m,weather_code&timezone=auto';
                fetch(url)
                    .then(function (r) { if (!r.ok) throw new Error('net'); return r.json(); })
                    .then(function (data) {
                        var cur = data && data.current;
                        if (!cur) throw new Error('empty');
                        var t = cur.temperature_2m;
                        var temp = (t != null && !isNaN(t)) ? Math.round(t) : '--';
                        var w = decodeWMO(cur.weather_code);
                        setWeather(cityName, w.text, w.emoji, temp);
                    })
                    .catch(function () { setMuted('天气暂不可用'); });
            }

            function reverseGeocode(lat, lon, fallbackName) {
                var url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' +
                    lat + '&longitude=' + lon + '&localityLanguage=zh';
                fetch(url)
                    .then(function (r) { if (!r.ok) throw new Error('net'); return r.json(); })
                    .then(function (g) {
                        var name = g.city || g.locality || g.principalSubdivision || fallbackName;
                        fetchWeather(lat, lon, name);
                    })
                    .catch(function () { fetchWeather(lat, lon, fallbackName); });
            }

            function loadDefault() {
                fetchWeather(DEFAULT.lat, DEFAULT.lon, DEFAULT.name);
            }

            // 自动获取地理位置；超时 / 拒绝 / 不可用则回退武汉
            if (navigator.geolocation) {
                var done = false;
                var timer = setTimeout(function () {
                    if (!done) { done = true; loadDefault(); }
                }, 8000);
                try {
                    navigator.geolocation.getCurrentPosition(
                        function (pos) {
                            if (done) return;
                            done = true; clearTimeout(timer);
                            var lat = pos.coords.latitude, lon = pos.coords.longitude;
                            reverseGeocode(lat, lon, '我的位置');
                        },
                        function () {
                            if (done) return;
                            done = true; clearTimeout(timer);
                            loadDefault();
                        },
                        { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
                    );
                } catch (e) {
                    if (!done) { done = true; clearTimeout(timer); loadDefault(); }
                }
            } else {
                loadDefault();
            }
        })();
    </script>

    <script>
        (function () {
            var bn = document.getElementById('bottomNav');
            if (bn) bn.classList.add('visible');
