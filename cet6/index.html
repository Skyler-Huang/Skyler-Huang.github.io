      <span class="bd ${type === "到期" ? "blue" : ""}">${type}</span>
      <span class="bd">${weakestLabel(d.id)}</span>
    </div>`).join("");

  return `
  <div class="dsec">
    <h2>一眼看完</h2>
    <p class="dsub">词库 ${total} 条 · 已毕业 ${grad} · 练过 ${seen} · 带真题句 ${examN}</p>
    <div class="statgrid">
      <div class="statcard"><div class="num">${total}</div><div class="lab">词库总条数</div></div>
      <div class="statcard"><div class="num">${grad}<small>/${total}</small></div><div class="lab">四项全稳 · 已毕业</div></div>
      <div class="statcard"><div class="num">${sprintN}</div><div class="lab">冲刺池可出题</div></div>
      <div class="statcard"><div class="num">${dueN}</div><div class="lab">当前到期（含超额）</div></div>
    </div>
    <div class="progress"><i style="width:${total ? (grad / total * 100).toFixed(1) : 0}%"></i></div>
    <p style="font-size:11px;color:var(--tx3);margin-top:4px">今天：回忆 ${todayAnswered()} 次 · 新词 ${todayNewCount()}/${SETTINGS.newLimit} · 复习 ${todayReviewCount()}/${SETTINGS.reviewLimit} · 队列还剩 新词 ${newN} / 复习 ${revN}</p>
    <div class="abilitygrid" style="margin-top:14px">${abilityCards}</div>
  </div>

  <div class="dsec">
    <h2>打卡 · 只记录，不惩罚</h2>
    <p class="dsub">每格一天，亮度是当天义项回忆次数。没有连续天数、没有断签、没有归零，也没有红字。</p>
    ${renderHeatmap(16)}
  </div>

  <div class="dsec">
    <h2>未来 7 天预计到期</h2>
    <p class="dsub">只统计已经进入记忆队列的词；新词按每日限额慢慢进来。这里看总量，不告诉你某个词“第几天再来”。</p>
    ${renderForecast()}
  </div>

  <div class="dsec">
    <h2>每日限额</h2>
    <p class="dsub">新词和复习分开限额，老词不挤占新词。场景练习也计入当天新词/复习。</p>
    <div class="settings">
      <div class="field"><label for="setNew">每日新词</label>
        <input id="setNew" data-setting="newLimit" type="number" min="1" max="100" value="${SETTINGS.newLimit}">
        <span class="help">1–100 任意整数，默认 6。学习页「今天学多少」读写同一个值。</span></div>
      <div class="field"><label for="setReview">每日复习</label>
        <input id="setReview" data-setting="reviewLimit" type="number" min="0" max="200" value="${SETTINGS.reviewLimit}">
        <span class="help">0–200 任意整数，默认 12。和学习页共用同一个值。</span></div>
      <div class="field"><label for="setScene">场景单轮题量</label>
        <select id="setScene" data-setting="sceneBatch">${[6, 10, 15, 20].map(n => `<option value="${n}" ${SETTINGS.sceneBatch === n ? "selected" : ""}>${n} 张</option>`).join("")}</select>
        <span class="help">自主浏览场景时，一轮最多做几张。</span></div>
    </div>
  </div>

  <div class="dsec">
    <h2>今天的队列</h2>
    <p class="dsub">手动挑的在前，到期复习其次，系统新词最后。学习页只显示剩余数量，不把这个列表摊在首页。</p>
    ${queueRows || '<div class="empty">今天这一队已经清完。断两天回来也不会归零，到期词会按超期程度补上。</div>'}
    ${q.manual.length + q.reviews.length + q.news.length > 40 ? '<p style="font-size:11px;color:var(--tx3)">只显示前 40 条。</p>' : ""}
  </div>`;
}

function renderHeatmap(weeks) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const dow = (today.getDay() + 6) % 7; // 周一 = 0
  const start = new Date(today); start.setDate(today.getDate() - dow - (weeks - 1) * 7);
  const todayK = dayKey(today.getTime());
  let cells = "";
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = dayKey(d.getTime());
    const c = LOG[k] || 0;
    const lv = c === 0 ? 0 : c <= 4 ? 1 : c <= 9 ? 2 : c <= 19 ? 3 : 4;
    const cls = "hcell" + (lv ? " l" + lv : "") + (k === todayK ? " today" : "");
    cells += `<span class="${cls}" title="${k} · ${c} 次义项回忆"></span>`;
  }
  return `<div class="heatwrap"><div class="heat">${cells}</div></div>
    <div class="heatlegend"><span>少</span><span class="hcell"></span><span class="hcell l1"></span><span class="hcell l2"></span><span class="hcell l3"></span><span class="hcell l4"></span><span>多</span>
      <span style="margin-left:auto">最近 ${weeks} 周 · 每格一天</span></div>`;
}

function renderForecast() {
  const base = startOfDay();
  const names = ["日", "一", "二", "三", "四", "五", "六"];
  const counts = [];
  for (let i = 0; i < 7; i++) {
    const s = base + i * DAY, e = s + DAY;
    let n = 0;
    Object.keys(SCHED).forEach(id => {
      if (isGrad(id)) return;
      const due = SCHED[id].d;
      if (i === 0) { if (due < e) n++; }
      else if (due >= s && due < e) n++;
    });
    counts.push(n);
  }
  const max = Math.max(...counts, 1);
  return `<div class="forecast">${counts.map((n, i) => {
    const d = new Date(base + i * DAY);
    const h = n ? Math.max(6, Math.round(n / max * 72)) : 2;
    return `<div class="fcol ${i === 0 ? "today" : ""}"><div class="fnum">${n}</div>
      <div class="fbar" style="height:${h}px"></div>
      <div class="fday">${i === 0 ? "今天" : i === 1 ? "明天" : "周" + names[d.getDay()]}</div></div>`;
  }).join("")}</div>`;
}

const TAG_OPTS = ["六级★", "熟词生义候选", "有真题句", "学术词汇", "高级词汇", "超课标", "我的词库"];

function libMatch(d) {
  if (LIB.tag.has("我的词库") && !isMy(d.id)) return false;
  for (const t of LIB.tag) {
    if (t !== "我的词库" && !(d.tags || []).includes(t)) return false;
  }
  if (LIB.st.has("todo") && isGrad(d.id)) return false;
  if (LIB.st.has("grad") && !isGrad(d.id)) return false;
  if (LIB.st.has("weak") && wrongTotal(d.id) === 0) return false;
  const q = LIB.q.trim().toLowerCase();
  if (!q) return true;
  const hay = [d.w, d.gloss, d.topic, (d.senses || []).map(s => (s.items || []).join(" ")).join(" "), d.exam ? d.exam.en : ""].join(" ").toLowerCase();
  return hay.includes(q);
}

/* 解析 CSV/TXT：自动识别分隔符、表头、尾部中文 */
function splitCsvLine(line, delim) {
  const out = [];
  let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (q && line[i + 1] === '"') { cur += '"'; i++; }
      else q = !q;
    } else if (c === delim && !q) {
      out.push(cur); cur = "";
    } else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

function parseCsvText(text, name) {
  const raw = text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  const lines = raw.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"));
  if (!lines.length) throw new Error("文件是空的");
  const candidates = ["\t", ",", ";", "|"];
  let delim = null, best = 0;
  candidates.forEach(d => {
    const n = lines.slice(0, 10).reduce((a, l) => a + (l.split(d).length - 1), 0);
    if (n > best) { best = n; delim = d; }
  });
  let rows;
  if (delim) {
    rows = lines.map(l => splitCsvLine(l, delim));
  } else {
    rows = lines.map(l => {
      const m = l.match(/^(\S+)\s+(.*)$/);
      return m ? [m[1], m[2]] : [l];
    });
  }
  rows = rows.filter(r => r.some(c => c !== ""));
  if (!rows.length) throw new Error("没有可读取的行");

  const head = rows[0].map(s => s.toLowerCase());
  const hw = head.findIndex(s => /^(word|单词|英文|词汇|term)$/.test(s));
  const hg = head.findIndex(s => /(释义|中文|意思|meaning|definition|translation|翻译)/.test(s));
  let header = null, mapW = -1, mapG = -1;
  if (hw >= 0 || hg >= 0) {
    header = rows.shift();
    mapW = hw;
    mapG = hg;
  }
  const cols = Math.max(...rows.map(r => r.length), 1);
  if (mapW >= cols) mapW = -1;
  if (mapG >= cols) mapG = -1;
  const scoreW = new Array(cols).fill(0), scoreG = new Array(cols).fill(0);
  rows.slice(0, 40).forEach(r => {
    for (let i = 0; i < cols; i++) {
      const v = (r[i] || "").trim();
      if (!v) continue;
      if (/^[A-Za-z][A-Za-z'’\- ]{0,40}$/.test(v)) scoreW[i] += 2;
      if (/[\u4e00-\u9fff]/.test(v)) scoreG[i] += 2;
      if (v.length > 24) scoreG[i] += 1;
    }
  });
  if (mapW < 0) mapW = scoreW.indexOf(Math.max(...scoreW));
  if (mapG < 0) {
    let bestG = -1, bestScore = -1;
    for (let i = 0; i < cols; i++) if (i !== mapW && scoreG[i] > bestScore) { bestScore = scoreG[i]; bestG = i; }
    mapG = bestG;
  }
  if (mapW < 0) mapW = 0;
  if (mapG === mapW) mapG = cols > 1 ? (mapW === 0 ? 1 : 0) : -1;

  const delimLabel = delim === "\t" ? "制表符" : delim === "," ? "逗号" : delim === ";" ? "分号" : delim === "|" ? "竖线" : "空格";
  return { name: name || "导入文件", rows, header, mapping: { w: mapW, g: mapG }, delim, delimLabel };
}

function splitGloss(raw) {
  let s = String(raw == null ? "" : raw).replace(/\s+/g, " ").trim();
  let pos = "";
  const m = s.match(/^([A-Za-z]{1,6}\.|\[[^\]]{1,10}\])\s*/);
  if (m) { pos = m[1]; s = s.slice(m[0].length).trim(); }
  const items = s.split(/[；;、\/]+/).map(x => x.trim().replace(/[。.;；,，]$/, "")).filter(Boolean);
  const uniq = [...new Set(items)].slice(0, 10);
  return { pos, items: uniq.length ? uniq : (s ? [s] : []) };
}

function customId(w) {
  const base = String(w).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) || "word";
  return "u-" + base + "-" + Date.now().toString(36) + "-" + rnd(999).toString(36);
}

function buildCustomEntry(w, gloss, src, tags) {
  const g = splitGloss(gloss);
  return {
    id: customId(w),
    w: w,
    ph: "",
    gloss: (g.items.join("；") || String(gloss || "")).slice(0, 80),
    senses: [{ pos: g.pos, items: g.items }],
    tags: [...new Set([...(tags || []), "我的词库"])],
    topic: "我的词库",
    pri: 50,
    freq: 0,
    custom: true,
    src: src || "自定义"
  };
}

function normalizeRow(wordCell, glossCell) {
  let w = String(wordCell == null ? "" : wordCell).trim();
  let g = String(glossCell == null ? "" : glossCell).trim();
  const m = w.match(/^([A-Za-z][A-Za-z'’\-]*(?:\s+[A-Za-z][A-Za-z'’\-]*)*)\s*([\u4e00-\u9fff].*)$/);
  if (m) { w = m[1].trim(); if (!g) g = m[2].trim(); }
  w = w.replace(/^[^A-Za-z]+/, "").replace(/[^A-Za-z'’\- ]+$/, "").replace(/\s+/g, " ").trim();
  return { w, g };
}

function confirmCsvImport() {
  if (!CSV_IMPORT) return;
  const { rows, mapping } = CSV_IMPORT;
  if (mapping.w < 0 || mapping.g < 0) { toast("先指定单词列和释义列"); return; }
  let added = 0, merged = 0, noGloss = 0, bad = 0;
  const seen = new Set(DATA.map(d => d.w.toLowerCase()));
  rows.forEach(row => {
    const n = normalizeRow(row[mapping.w], row[mapping.g]);
    if (!n.w || !/^[A-Za-z][A-Za-z'’\- ]{0,39}$/.test(n.w)) { bad++; return; }
    if (!n.g) { noGloss++; return; }
    const key = n.w.toLowerCase();
    const existing = DATA.find(d => d.w.toLowerCase() === key);
    if (existing) {
      if (!MY.includes(existing.id)) { MY.push(existing.id); merged++; }
      return;
    }
    if (seen.has(key)) return;
    seen.add(key);
    const e = buildCustomEntry(n.w, n.g, "CSV/TXT 导入", ["我的词库"]);
    MYWORDS.push(e);
    DATA.push(e);
    MY.push(e.id);
    added++;
  });
  rebuildPools();
  save();
  CSV_IMPORT = null;
  let msg = `导入 ${added} 个新词`;
  if (merged) msg += `，${merged} 个已存在并加入我的词库`;
  if (noGloss) msg += `，${noGloss} 行缺释义跳过`;
  if (bad) msg += `，${bad} 行单词格式不对`;
  toast(msg);
  render();
}

      <button type="button" class="ghostbtn" data-act="lookup-local">只看本地词条</button>
    </div>
    <div class="ydsource">只取 ec.word[0] 的 trs / ukphone / usphone / wfs；标签取 ec.exam_type 与 individual.level。已清洗 HTML、词性前缀和分号。</div>

function findLocal(q) {
  const s = String(q || "").trim().toLowerCase();
  if (!s) return [];
  const exact = [], like = [];
  DATA.forEach(d => {
    const w = d.w.toLowerCase();
    if (w === s) { exact.push(d); return; }
    const hay = [d.w, d.gloss, (d.senses || []).map(x => (x.items || []).join(" ")).join(" ")].join(" ").toLowerCase();
    if (hay.includes(s)) like.push(d);
  });
  return [...exact, ...like].slice(0, 8);
}

function cleanYoudaoText(s) {
  return String(s == null ? "" : s)
    .replace(/<br\s*\/?>/gi, "；")
    .replace(/<\/?(b|i|em|strong|span|font|sup|sub)[^>]*>/gi, "")
    .replace(/<([\u4e00-\u9fa5]{1,4})>/g, "（$1）")
    .replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/（([^）]{1,12})）\s+/g, "（$1）")
    .replace(/\s+/g, " ")
    .trim();
}
function cleanItem(s) {
  return cleanYoudaoText(s).replace(/^[；;，,\s]+/, "").replace(/[。；;，,\s]+$/, "").trim();
}

/* 实测结构：ec.word[0].trs = [{tr:[{l:{i:["n. 地址，住址；网址；…"]}}]}, {tr:[…v.…]}] */
function parseYoudaoEc(j) {
  const w = j && j.ec && j.ec.word && j.ec.word[0];
  if (!w) throw new Error("NO_EC");
  const groups = [];
  const add = (pos, items) => {
    if (!items || !items.length) return;
    let g = groups.find(x => x.pos === pos);
    if (!g) { g = { pos: pos || "", items: [] }; groups.push(g); }
    items.forEach(it => { if (it && !g.items.includes(it) && g.items.length < 12) g.items.push(it); });
  };
  (w.trs || []).forEach(t => {
    (t.tr || []).forEach(tr => {
      const arr = tr && tr.l && tr.l.i;
      const list = Array.isArray(arr) ? arr : (arr ? [arr] : []);
      list.forEach(raw => {
        const text = cleanYoudaoText(raw);
        if (!text) return;
        const m = text.match(/^([A-Za-z]{1,6}\.|\[[^\]]{1,12}\])\s*/);
        const pos = m ? m[1] : "";
        const body = m ? text.slice(m[0].length) : text;
        const items = body.split(/[；;]/).map(cleanItem).filter(Boolean);
        add(pos, items);
      });
    });
  });
  if (!groups.length) {
    ((j.individual && j.individual.trs) || []).forEach(t => {
      if (t && t.tran) add(t.pos || "", [cleanItem(t.tran)]);
    });
  }
  if (!groups.length) throw new Error("PARSE_EMPTY");
  const wfs = (w.wfs || []).map(x => x.wf ? { name: x.wf.name, value: x.wf.value } : x).filter(x => x && x.value);
  const tags = [];
  ((j.ec && j.ec.exam_type) || []).forEach(t => { if (/CET|考研|IELTS|TOEFL|GRE|专四|专八|高考|中考/.test(t)) tags.push(t); });
  if (j.individual && j.individual.level) tags.push(j.individual.level);
  return {
    word: (w["return-phrase"] && w["return-phrase"].l && w["return-phrase"].l.i) || j.input || "",
    phones: { uk: w.ukphone || "", us: w.usphone || "" },
    groups, wfs, tags: [...new Set(tags)],
    source: "jsonapi", canAdd: true, truncated: false
  };
}

function parseYoudaoSuggest(data, word) {
  const entries = (data && data.data && data.data.entries) || [];
  const e = entries.find(x => x && String(x.entry).toLowerCase() === String(word).toLowerCase()) || entries[0];
  if (!e || !e.explain) throw new Error("NO_SUGGEST");
  const raw = cleanYoudaoText(e.explain);
  const truncated = /\.\.\./.test(raw) || /…/.test(raw);
  const text = raw.replace(/\.\.\.$/, "").replace(/…$/, "").trim();
  const m = text.match(/^([A-Za-z]{1,6}\.)\s*/);
  const pos = m ? m[1] : "";
  const body = m ? text.slice(m[0].length) : text;
  const items = body.split(/[；;]/).map(cleanItem).filter(x => x && !/^\.\.\.$/.test(x) && !x.includes("..."));
  if (truncated && items.length > 1) items.pop(); // 最后一条通常是被截断的半句，展示时不要它
  if (!items.length) throw new Error("SUGGEST_EMPTY");
  return {
    word: e.entry || word,
    phones: { uk: "", us: "" },
    groups: [{ pos, items: items.slice(0, 10) }],
    wfs: [], tags: [],
    source: "suggest", canAdd: !truncated, truncated
  };
}

async function fetchYoudaoJsonRaw(word) {
  if (typeof fetch !== "function") throw new Error("NO_FETCH");
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 4500);
  try {
    const res = await fetch("https://dict.youdao.com/jsonapi?q=" + encodeURIComponent(word), {
      signal: ctrl.signal, headers: { "Accept": "application/json" }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function jsonp(url, timeout) {
  return new Promise((resolve, reject) => {
    const cb = "__yd_cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    let done = false;
    const cleanup = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    };
    const timer = setTimeout(() => { cleanup(); reject(new Error("TIMEOUT")); }, timeout || 6000);
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("NETWORK")); };
    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb;
    document.head.appendChild(s);
  });
}

async function fetchYoudaoSuggest(word) {
  const url = "https://dict.youdao.com/suggest?num=1&doctype=json&q=" + encodeURIComponent(word);
  const data = await jsonp(url, 4000);
  return parseYoudaoSuggest(data, word);
}

function finishLookup(data, source) {
  LOOKUP.data = data;
  LOOKUP.source = source;
  LOOKUP.err = "";
  LOOKUP.localMode = false;
  LOOKUP.status = "ok";
  LOOKUP.hits = findLocal(LOOKUP.word);
  LOOKUP.loading = false;
  if (data) LOOKUP_CACHE.set(LOOKUP.word.toLowerCase(), { at: Date.now(), data, source });
  if (LOOKUP_CACHE.size > 30) LOOKUP_CACHE.delete(LOOKUP_CACHE.keys().next().value);
  render();
}

function finishLocalLookup(err) {
  LOOKUP.data = null;
  LOOKUP.source = "local";
  LOOKUP.err = err || "这次没联网查到，已降级为只搜本地词库。";
  LOOKUP.localMode = true;
  LOOKUP.status = "local";
  LOOKUP.hits = findLocal(LOOKUP.word);
  LOOKUP.loading = false;
  LOOKUP_CACHE.set(LOOKUP.word.toLowerCase(), { at: Date.now(), data: null, source: "local" });
  if (LOOKUP_CACHE.size > 30) LOOKUP_CACHE.delete(LOOKUP_CACHE.keys().next().value);
  render();
}

async function doLookup() {
  const input = $("#lookupQ");
  const raw = (input ? input.value : LOOKUP.word || "").trim();
  if (!raw) { toast("先输入一个词"); return; }
  if (LOOKUP.loading) { toast("上一次还在查，稍等"); return; }
  LOOKUP.word = raw;
  LOOKUP.loading = true;
  QL.pending = false;
  LOOKUP.data = null;
  LOOKUP.hits = findLocal(raw); // 本地先给一份，不让网络把整块区域占成空白
  LOOKUP.err = "";
  LOOKUP.localMode = false;
  LOOKUP.status = "loading";
  render();

  const isEn = /^[A-Za-z][A-Za-z'’\- ]{0,40}$/.test(raw);
  if (!isEn) {
    LOOKUP.word = raw;
    finishLocalLookup("输入的不是英文单词，只在本地词库里找。");
    return;
  }
  const key = raw.toLowerCase();
  const cached = LOOKUP_CACHE.get(key);
  if (cached && Date.now() - cached.at < 10000) {
    if (cached.data) {
      LOOKUP.data = cached.data;
      LOOKUP.source = cached.source;
      LOOKUP.status = "ok";
      LOOKUP.hits = findLocal(raw);
      LOOKUP.loading = false;
      render();
      toast("10 秒内刚查过，先用缓存");
    } else {
      finishLocalLookup("10 秒内刚查过，这个词上次没查到，先只搜本地。");
    }
    return;
  }

  const gap = Math.max(0, 260 - (Date.now() - LAST_LOOKUP_AT));
  if (gap) await sleep(gap);
  LAST_LOOKUP_AT = Date.now();

  try {
    const j = await fetchYoudaoJsonRaw(raw);
    try {
      const data = parseYoudaoEc(j);
      finishLookup(data, "jsonapi");
    } catch (parseErr) {
      const w = j && j.ec && j.ec.word && j.ec.word[0];
      LOOKUP.data = {
        word: raw,
        phones: { uk: (w && w.ukphone) || "", us: (w && w.usphone) || "" },
        groups: [], wfs: [], tags: [],
        source: "jsonapi", canAdd: false, truncated: false, parseError: true
      };
      LOOKUP.source = "jsonapi";
      LOOKUP.status = "ok";
      LOOKUP.err = "";
      LOOKUP.localMode = false;
      LOOKUP.hits = findLocal(raw);
      LOOKUP.loading = false;
      render();
    }
  } catch (e1) {
    try {
      const data = await fetchYoudaoSuggest(raw);
      finishLookup(data, "suggest");
    } catch (e2) {
      finishLocalLookup("有道接口这次没返回（可能是跨域拦截、限流或断网），已降级为只搜本地词库。");
    }
  }
}

function addLookupEntry() {
  const d = LOOKUP.data;
  if (!d) return;
  if (!d.canAdd) { toast(d.truncated ? "这个兜底来源只返回截断释义，先不加入" : "解析异常，暂不支持加入"); return; }
  const w = String(d.word || LOOKUP.word).trim();
  const existing = DATA.find(x => x.w.toLowerCase() === w.toLowerCase());
  if (existing) {
    if (!MY.includes(existing.id)) MY.push(existing.id);
    save(); toast("词库里已有，已加入我的词库"); LOOKUP.data = null; render(); return;
  }
  const gloss = (d.groups || []).flatMap(g => g.items || []).join("；");
  if (!gloss) { toast("没有可用的中文释义，暂不加入"); return; }
  const e = buildCustomEntry(w, gloss, "有道 " + (LOOKUP.source === "jsonapi" ? "jsonapi" : "suggest"), d.tags || []);
  e.ph = (d.phones && (d.phones.uk || d.phones.us)) || "";
  e.senses = (d.groups || []).map(g => ({ pos: g.pos || "", items: (g.items || []).slice(0, 12) })).filter(s => s.items.length);
  e.gloss = ((d.groups && d.groups[0] && d.groups[0].items && d.groups[0].items[0]) || e.gloss || "").slice(0, 40);
  e.wfs = d.wfs || [];
  MYWORDS.push(e);
  DATA.push(e);
  MY.push(e.id);
  rebuildPools();
  save();
  LOOKUP.data = null;
  toast("已加入我的词库，会参与同样的义项出题");
  render();
}

function addLocalHit(id) {
  if (!MY.includes(id)) MY.push(id);
  save();
  toast("已加入我的词库");
  render();
}

/* ── 预测校验 ───────────────────────────────────────────── */
function sysPredict(ids) {
  return ids.filter(id => {
    const d = DATA.find(x => x.id === id);
    if (!d) return false;
    const p = PROG[id];
    if (p && wrongTotal(id) > 0) return true;
    if (d.familiar) return true;
    if (!p || ABILITIES.some(k => (p[k] || 0) < 2)) return true;
    return false;
  });
}

function buildPredictIds() {
  const q = buildSprintQueue();
  let ids = q.ids.slice();
  if (ids.length < 6) {
    const extra = sprintPool().filter(d => !ids.includes(d.id)).sort((a, b) => dynamicPri(b) - dynamicPri(a)).slice(0, 10 - ids.length);
    ids = ids.concat(extra.map(d => d.id));
  }
  return [...new Set(ids)].slice(0, 10);
}

function startPredict() {
  if (Q.active && Q.i < Q.items.length) {
    if (!confirm("会结束当前这一轮（已经答过的都已保存）。继续？")) return;
  }
  const ids = buildPredictIds();
  if (!ids.length) { toast("冲刺池里没有可预测的词了"); return; }
  PRED = { active: true, ids, sys: sysPredict(ids), user: [], done: [] };
  MODE = "diag";
  DIAG_TAB = "predict";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function confirmPredict() {
  PRED.user = [...document.querySelectorAll("#pg input:checked")].map(i => i.value);
  startQuiz(PRED.ids, true, "sprint");
}

function startQuiz(ids, fromPredict, board) {
  const items = ids.map(id => DATA.find(d => d.id === id)).filter(Boolean);
  if (!items.length) { toast("没有可练的词"); return; }
  Q = {
    active: true, board: board || "sprint", mode: board === "scene" ? "scene" : "sprint",
    items, i: 0, cur: null, wrong: [], results: [], fromPredict: !!fromPredict, final: null,
    reviewN: 0, sceneTitle: board === "scene" ? "场景" : ""
  };
  MODE = "study";
  BOARD = board || "sprint";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function quickLookupHtml() {
  const d = LOOKUP.data;
  let result = "";
  if (LOOKUP.loading) {
    result = '<div class="lookup-empty" style="margin-top:10px">查词中… 本地匹配先放在下面，联网结果到了再替换。</div>';
  } else if (d) {
    const phones = [d.phones && d.phones.uk ? `英 /${d.phones.uk}/` : "", d.phones && d.phones.us ? `美 /${d.phones.us}/` : ""].filter(Boolean).join(" · ");
    const groups = (d.groups || []).map(g => `<div class="ydgroup"><span class="pos">${esc(g.pos || "释义")}</span><span class="items">${esc((g.items || []).join("；"))}</span></div>`).join("");
    const tags = (d.tags || []).map(t => `<span class="bd blue">${esc(t)}</span>`).join("");
    const bad = !d.canAdd && !d.truncated ? '<div class="warnbox"><b>原始字段解析异常，暂不支持加入。</b>这是数据源的问题，不是你的输入问题。</div>' : "";
    const trunc = d.truncated ? '<div class="warnbox">这个兜底来源只返回截断释义，暂不支持加入，避免污染义项池。</div>' : "";
    const source = LOOKUP.source === "jsonapi" ? "有道 jsonapi" : LOOKUP.source === "suggest" ? "有道 suggest（跨域兜底）" : "本地词库";
    result = `<div class="ydcard">
      <div class="ydhead"><span class="w">${esc(d.word || LOOKUP.word)}</span><span class="phone">${esc(phones)}</span></div>
      <div class="ydtags">${tags}<span class="bd">来源：${esc(source)}</span></div>
      ${groups || '<div class="lookup-empty">没有解析出可用的中文释义。</div>'}
      ${(d.wfs || []).length ? `<div class="ydwfs">词形：${d.wfs.slice(0, 6).map(x => `${esc(x.name || "")} ${esc(x.value || "")}`).join(" · ")}</div>` : ""}
      ${trunc}${bad}
      ${d.canAdd ? (QL.pending
        ? `<div class="quickactions">
            <button type="button" class="primary" data-act="quick-now">现在练它</button>
            <button type="button" class="ghostbtn" data-act="quick-store">放进我的词库</button>
            <button type="button" class="textlink" data-act="quick-stage-back">先别加</button>
          </div>`
        : `<div class="quickactions"><button type="button" class="primary" data-act="quick-stage">加入我的词库</button></div>`)
        : ""}
    </div>`;
  } else if (LOOKUP.status === "error" || LOOKUP.localMode) {
    result = `<div class="warnbox">${esc(LOOKUP.err || "这次没查到，下面只搜本地词库。")}</div>`;
  }

  const hits = LOOKUP.hits.length ? `<div class="quicklocal">
    <div class="libmeta" style="margin:0 0 4px">本地词库匹配 ${LOOKUP.hits.length} 条</div>
    ${LOOKUP.hits.map(h => `<div class="localhit"><span class="w">${esc(h.w)}</span><span class="g">${esc(h.gloss || "")}</span>
      <span class="mini-actions">
        <button type="button" data-act="quick-local-now" data-id="${esc(h.id)}">现在练它</button>
        <button type="button" data-act="quick-local-store" data-id="${esc(h.id)}">放进词库</button>
      </span></div>`).join("")}
  </div>` : "";

  return modalShell("查词", `
    <div class="searchbar"><input id="lookupQ" type="search" placeholder="输入英文单词，回车查" value="${esc(LOOKUP.word)}" autocomplete="off" spellcheck="false"><button type="button" data-act="lookup">查词</button></div>
    <p class="modalnote">查到后先预览；加入时再选「现在练它」或「放进我的词库」。释义来自有道免费接口，仅限个人学习研究，控制频率。</p>
    ${result}${hits}
    ${!d && !LOOKUP.hits.length && !LOOKUP.loading ? '<div class="lookup-empty">输入一个词开始查。查不到时会只搜本地词库。</div>' : ""}
  `);
}

function entryFromLookupData(d) {
  const w = String(d.word || LOOKUP.word || "").trim();
  if (!w) return null;
  const existing = DATA.find(x => x.w.toLowerCase() === w.toLowerCase());
  if (existing) {
    if (!MY.includes(existing.id)) MY.push(existing.id);
    return existing;
  }
  const gloss = (d.groups || []).flatMap(g => g.items || []).join("；");
  if (!gloss) return null;
  const e = buildCustomEntry(w, gloss, "有道 " + (LOOKUP.source === "jsonapi" ? "jsonapi" : "suggest"), d.tags || []);
  e.ph = (d.phones && (d.phones.uk || d.phones.us)) || "";
  e.senses = (d.groups || []).map(g => ({ pos: g.pos || "", items: (g.items || []).slice(0, 12) })).filter(s => s.items.length);
  e.gloss = ((d.groups && d.groups[0] && d.groups[0].items && d.groups[0].items[0]) || e.gloss || "").slice(0, 40);
  MYWORDS.push(e);
  DATA.push(e);
  MY.push(e.id);
  rebuildPools();
  return e;
}

function quickUseWord(d, mode) {
  if (!d) return;
  if (mode === "now" && answeredToday(d.id)) {
    toast("这个词今天已经做过了");
    return;
  }
  if (mode === "now" && isGrad(d.id)) {
    toast("这个词已经四项全稳毕业，不再进今日队列");
    return;
  }
  if (!MY.includes(d.id)) MY.push(d.id);
  save();
  if (mode === "store") {
    save();
    closeModal();
    toast("已放进我的词库，可去场景词汇 → 我的词库练");
    return;
  }
  const already = isManual(d.id);
  if (!already && manualCapacityLeft() <= 0) {
    toast("今日新词额度已满，先把已有的做掉，或点「今天学多少」调大额度");
    return;
  }
  ensureManualDay();
  addManual(d.id, true);
  if (!MANUAL.quick.includes(d.id)) MANUAL.quick.push(d.id);
  save();

  if (Q.active && Q.mode === "sprint" && Q.i < Q.items.length) {
    const wasAnswered = !!(Q.cur && Q.cur.answered);
    const idx = Q.items.findIndex(x => x.id === d.id);
    if (idx === Q.i) {
      closeModal();
      toast("这张就是它");
      return;
    }
    if (idx > Q.i) {
      const [it] = Q.items.splice(idx, 1);
      Q.items.splice(Q.i + 1, 0, it);
    } else if (idx === -1) {
      Q.items.splice(Q.i + 1, 0, d);
    }
    MODAL = null; QL.pending = false;
    render();
    if (wasAnswered) setTimeout(() => { if (Q.active && Q.cur && Q.cur.answered) nextQ(); }, 30);
    return;
  }
  if (Q.active && Q.mode === "scene") {
    MODAL = null; QL.pending = false;
    render();
    toast("已加入今日冲刺队列，切到「六级冲刺池」就开始");
    return;
  }
  MODAL = null; QL.pending = false;
  startSession(false);
}

function quickCommit(mode) {
  if (!LOOKUP.data || !LOOKUP.data.canAdd) { toast("这条预览暂不支持加入"); return; }
  if (mode === "now") {
    const w = String(LOOKUP.data.word || LOOKUP.word || "").trim();
    const ex = DATA.find(x => x.w.toLowerCase() === w.toLowerCase());
    if (ex && (isGrad(ex.id) || answeredToday(ex.id))) {
      toast(isGrad(ex.id) ? "这个词已经毕业，不再进今日队列" : "这个词今天已经做过了");
      return;
    }
    if (!(ex && isManual(ex.id)) && manualCapacityLeft() <= 0) {
      toast("今日新词额度已满，先把已有的做掉，或点「今天学多少」调大额度");
      return;
    }
  }
  const e = entryFromLookupData(LOOKUP.data);
  if (!e) { toast("没有可用的中文释义，暂不加入"); return; }
  LOOKUP.data = null;
  LOOKUP.status = "idle";
  quickUseWord(e, mode);
}

function quickLocal(id, mode) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  if (!MY.includes(d.id)) MY.push(d.id);
  quickUseWord(d, mode);
}

/* 挑今天要学的词 */
function manualCandidates() {
  ensureManualDay();
  const now = Date.now();
  const q = MANUAL_UI.q.trim().toLowerCase();
  return DATA.filter(d => (isSprintWord(d) || isMy(d.id)) && needsMeaning(d) && !isDue(d.id, now) && !answeredToday(d.id))
    .filter(d => MANUAL_UI.onlyUngrad ? !isGrad(d.id) : true)
    .filter(d => {
      if (!q) return true;
      const hay = [d.w, d.gloss, (d.senses || []).map(s => (s.items || []).join(" ")).join(" ")].join(" ").toLowerCase();
      return hay.includes(q);
    })
    .sort((a, b) => dynamicPri(b) - dynamicPri(a));
}

  return modalShell("挑今天要学的词", `

    <label class="switch" style="margin:2px 0 8px"><input type="checkbox" id="manualOnly" ${MANUAL_UI.onlyUngrad ? "checked" : ""}>只看未毕业</label>

    </div>

    <div class="manuallist">${rows || '<div class="manualempty">没有匹配的词。</div>'}</div>
    <p class="modalnote">${list.length > show.length ? `只显示前 ${show.length} 个，用搜索缩小范围。` : ""}手动挑的词计入今日新词额度；已到期的复习词不在这里，仍由系统复习队列安排。</p>
    <input type="file" id="manualFile" class="manualfile" accept=".csv,.txt,text/plain,text/csv">
    <div class="modalfoot">
      <button type="button" class="ghostbtn" data-act="manual-import">从文件导入今日词表</button>

function toggleManual(id) {
  const list = document.querySelector(".manuallist");
  const scrollTop = list ? list.scrollTop : 0;
  if (isManual(id)) {
    removeManual(id); save(); render();
    const after = document.querySelector(".manuallist"); if (after) after.scrollTop = scrollTop;
    return;
  }
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  if (answeredToday(id)) { toast("这个词今天已经做过了"); return; }
  if (isGrad(id)) { toast("这个词已经四项全稳毕业，不再进新词队列"); return; }
  if (manualCapacityLeft() <= 0) { toast("今日新词额度已满，先做掉几个或把额度调大"); return; }
  addManual(id, false);
  save();
  render();
  const after = document.querySelector(".manuallist"); if (after) after.scrollTop = scrollTop;
}

function decodeBuffer(buf) {
  let text = new TextDecoder("utf-8").decode(buf);
  if (text.includes("\uFFFD")) {
    try {
      const gbk = new TextDecoder("gbk").decode(buf);
      if (!gbk.includes("\uFFFD")) text = gbk;
    } catch (e) {}
  }
  return text;
}

function importManualText(text, label) {
  const parsed = parseCsvText(text, label);
  const wc = parsed.mapping.w, gc = parsed.mapping.g;
  if (wc < 0) { toast("没有找到单词列"); return; }
  let accepted = 0, overflow = 0, missing = 0, due = 0, dup = 0;
  let room = manualCapacityLeft();
  parsed.rows.forEach(row => {
    const n = normalizeRow(row[wc], gc >= 0 ? row[gc] : "");
    if (!n.w) return;
    let d = DATA.find(x => x.w.toLowerCase() === n.w.toLowerCase());
    if (d) {
      if (answeredToday(d.id) || isGrad(d.id) || isDue(d.id)) { due++; return; }
    } else {
      if (!n.g) { missing++; return; }
      d = buildCustomEntry(n.w, n.g, "文件导入", ["我的词库"]);
      MYWORDS.push(d);
      DATA.push(d);
      MY.push(d.id);
      rebuildPools();
    }
    if (isManual(d.id)) { dup++; return; }
    if (room > 0) {
      addManual(d.id, false);
      accepted++;
      room--;
    } else {
      overflow++;
      if (!MY.includes(d.id)) MY.push(d.id);
    }
  });
  save();
  render();
  let msg = `导入 ${parsed.rows.length} 个词`;
  if (accepted) msg += `，今日额度收下 ${accepted} 个`;
  if (overflow) msg += `，剩下 ${overflow} 个放进我的词库，明天再学`;
  if (missing) msg += `，${missing} 个缺释义未进队列`;
  if (due) msg += `，${due} 个到期/已毕业词由系统队列处理`;
  if (dup) msg += `，${dup} 个已在今日队列`;
  toast(msg);
}

function handleManualFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try { importManualText(decodeBuffer(r.result), file.name); }
    catch (err) { toast("读取失败：" + err.message); }
  };
  r.readAsArrayBuffer(file);
}

/* ── 顶栏 / 路由 ────────────────────────────────────────── */
function updateTopbar() {
  const boards = $("#boards");
  const diagBtn = $("#diagBtn");
  const isDiag = MODE === "diag";
  if (boards) boards.hidden = isDiag;
  const quick = $("#quickLookupBtn");
  if (quick) quick.hidden = isDiag;
  if (diagBtn) diagBtn.innerHTML = isDiag ? "← 返回学习" : '<span class="dotmark"></span>诊断';
  document.body.classList.toggle("diagmode", isDiag);
  document.querySelectorAll(".board").forEach(b => b.classList.toggle("on", b.dataset.board === BOARD));
}

function render() {
  clearTimeout(ADVANCE_TIMER);
  updateTopbar();
  const app = $("#app");
  if (!app) return;
  let html = "";
  if (MODE === "diag") html = renderDiag();
  else if (BOARD === "scene") {
    if (Q.active && Q.mode === "scene" && Q.board === "scene") {
      html = `<div class="study">${Q.i >= Q.items.length ? doneHtml() : quizHtml()}</div>`;
    } else {
      html = renderScene();
    }
  }
  else html = renderStudy();
  app.innerHTML = html + (MODAL ? renderModal() : "");
  document.body.classList.toggle("modal-open", !!MODAL);
  bindDynamic();
  if (MODE === "study" && !MODAL && Q.active && Q.cur && !Q.cur.answered) {
    if (Q.cur.kind === "write") {
      setTimeout(() => {
        const t = $("#typeIn");
        if (t) {
          t.focus();
          t.setSelectionRange(t.value.length, t.value.length);
          if (innerWidth < 680) t.scrollIntoView({ block: "center", behavior: "smooth" });
        }
      }, 60);
    }
  }
}

function setBoard(b) {
  if (b === BOARD && MODE === "study") return;
  // 切换板块不丢当前这一轮：只换视图，Q 留在内存里；
  // 真正开始另一板块的练习时才提示结束。
  BOARD = b;
  MODE = "study";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggleDiag() {
  MODAL = null;
  if (MODE === "diag") {
    MODE = "study";
    render();
  } else {
    MODE = "diag";
    DIAG_TAB = "overview";
    render();
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function gradOne(id) {
  P(id).grad = true;
  save();
  render();
  toast("已标记毕业，移出冲刺池");
}
function ungrad(id) {
  P(id).grad = false;
  if (SCHED[id]) SCHED[id].d = Date.now();
  else SCHED[id] = { i: 1, d: Date.now(), l: 0, first: dayKey(Date.now() - DAY), s: 0 };
  save();
  render();
  toast("已撤销毕业，回到队列");
}
function removeMy(id) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  if (d.custom) {
    if (!confirm("从我的词库删除「" + d.w + "」？这个词条会从词库移除，练习进度保留但不再出题。")) return;
    DATA = DATA.filter(x => x.id !== id);
    MYWORDS = MYWORDS.filter(x => x.id !== id);
    MY = MY.filter(x => x !== id);
    removeManual(id);
    delete SCHED[id];
    if (Q.cur && Q.cur.d && Q.cur.d.id === id) Q.cur = null;
    rebuildPools();
  } else {
    MY = MY.filter(x => x !== id);
    if (isManual(id)) removeManual(id);
  }
  save();
  render();
  toast(d.custom ? "已从我的词库删除" : "已移出我的词库");
}

/* ── 事件 ───────────────────────────────────────────────── */
function onAppClick(e) {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  switch (act) {
    case "start": startSession(false); break;
    case "skip": startSession(true); break;
    case "again": startSession(false); break;
    case "next": nextQ(); break;
    case "stuck": answer("__STUCK__"); break;
    case "opt": answer(el.dataset.opt); break;
    case "speak": if (Q.cur) speak(Q.cur.d.w); break;
    case "add": addCurrent(); break;
    case "modal-close": closeModal(); break;
    case "limits-open": openLimits(); break;
    case "manual-open": openManual(); break;
    case "limit-new": setLimit("newLimit", parseInt(el.dataset.v, 10)); break;
    case "limit-review": setLimit("reviewLimit", parseInt(el.dataset.v, 10)); break;
    case "limit-apply": applyCustomLimits(); break;
    case "manual-clear": MANUAL_UI.q = ""; render(); break;
    case "manual-import": { const f = $("#manualFile"); if (f) f.click(); break; }
    case "quick-open": openQuickLookup(); break;
    case "quick-stage": QL.pending = true; render(); break;
    case "quick-stage-back": QL.pending = false; render(); break;
    case "quick-now": quickCommit("now"); break;
    case "quick-store": quickCommit("store"); break;
    case "quick-local-now": quickLocal(el.dataset.id, "now"); break;
    case "quick-local-store": quickLocal(el.dataset.id, "store"); break;
    case "go-scene": setBoard("scene"); break;
    case "go-diag": MODE = "diag"; DIAG_TAB = "overview"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "go-predict": MODE = "diag"; DIAG_TAB = "predict"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "scene-topic": SCENE.topic = el.dataset.topic; render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "scene-back":
      SCENE.topic = "";
      if (Q.active && Q.mode === "scene") Q.active = false;
      render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "scene-more": SCENE.showAll = true; render(); break;
    case "scene-start": startSceneSession(); break;
    case "scene-again": startSceneSession(); break;
    case "wrow": {
      const box = document.getElementById("wd-" + el.dataset.id);
      if (box) { box.hidden = !box.hidden; el.textContent = box.hidden ? "义项 ▾" : "义项 ▴"; }
      break;
    }
    case "diag-tab": DIAG_TAB = el.dataset.tab; render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "lib-tag": {
      const v = el.dataset.v;
      if (LIB.tag.has(v)) LIB.tag.delete(v); else LIB.tag.add(v);
      LIB.limit = 30; render(); break;
    }
    case "lib-st": {
      const v = el.dataset.v;
      if (LIB.st.has(v)) LIB.st.delete(v); else LIB.st.add(v);
      LIB.limit = 30; render(); break;
    }
    case "lib-reset": LIB.tag.clear(); LIB.st.clear(); LIB.q = ""; LIB.limit = 30; render(); break;
    case "lib-clear": LIB.q = ""; LIB.limit = 30; render(); break;
    case "lib-more": LIB.limit += 30; render(); break;
    case "lib-import-jump": { const el = document.getElementById("importSection"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); break; }
    case "grad": gradOne(el.dataset.id); break;
    case "ungrad": ungrad(el.dataset.id); break;
    case "remove-my": removeMy(el.dataset.id); break;
    case "export-lib": exportLib(); break;
    case "export-prog": exportProg(); break;
    case "pick-lib": { const f = $("#fileLib"); if (f) f.click(); break; }
    case "pick-prog": { const f = $("#fileProg"); if (f) f.click(); break; }
    case "pick-csv": { const f = $("#fileCsv"); if (f) f.click(); break; }
    case "clear-prog": clearProg(); break;
    case "csv-clear": CSV_IMPORT = null; render(); break;
    case "csv-confirm": confirmCsvImport(); break;
    case "lookup": doLookup(); break;
    case "lookup-add": addLookupEntry(); break;
    case "lookup-local": LOOKUP.data = null; LOOKUP.localMode = true; LOOKUP.err = "只显示本地词库的结果。"; LOOKUP.hits = findLocal(LOOKUP.word); render(); break;
    case "lookup-clear": LOOKUP = { word: "", status: "idle", data: null, source: "", err: "", hits: [], localMode: false, loading: false }; render(); break;
    case "local-add": addLocalHit(el.dataset.id); break;
    case "pred-start": startPredict(); break;
    case "pred-confirm": confirmPredict(); break;
    case "pred-cancel": PRED.active = false; render(); break;
    case "detail-hint": break;
  }
}

function onAppChange(e) {
  const t = e.target;
  if (t.matches("[data-setting]")) {
    const k = t.dataset.setting;
    const v = parseInt(t.value, 10);
    if (k === "newLimit") SETTINGS.newLimit = clampNew(v, SETTINGS.newLimit);
    else if (k === "reviewLimit") SETTINGS.reviewLimit = clampReview(v, SETTINGS.reviewLimit);
    else if (k === "sceneBatch" && [6, 10, 15, 20].includes(v)) SETTINGS.sceneBatch = v;
    save(); render(); toast("已保存");
    return;
  }
  if (t.id === "basicOnly") { SCENE.basicOnly = t.checked; render(); return; }
  if (t.id === "manualOnly") { MANUAL_UI.onlyUngrad = t.checked; render(); return; }
  if (t.matches("[data-manual-id]")) { toggleManual(t.dataset.manualId); return; }
  if (t.id === "manualFile" && t.files && t.files[0]) {
    const f = t.files[0];
    handleManualFile(f);
    t.value = "";
    return;
  }
  if (t.matches("[data-csvmap]") && CSV_IMPORT) {
    const k = t.dataset.csvmap;
    CSV_IMPORT.mapping[k] = parseInt(t.value, 10);
    render();
    return;
  }
  if (t.id === "fileCsv" && t.files && t.files[0]) {
    const f = t.files[0];
    const r = new FileReader();
    r.onload = () => {
      try {
        const buf = r.result;
        let text = new TextDecoder("utf-8").decode(buf);
        if (text.includes("\uFFFD")) {
          try {
            const gbk = new TextDecoder("gbk").decode(buf);
            if (!gbk.includes("\uFFFD")) text = gbk;
          } catch (e) {}
        }
        CSV_IMPORT = parseCsvText(text, f.name);
        render();
      } catch (err) { toast("读取失败：" + err.message); }
    };
    r.readAsArrayBuffer(f);
    t.value = "";
    return;
  }
  if (t.id === "fileLib" && t.files && t.files[0]) {
    const f = t.files[0], r = new FileReader();
    r.onload = () => {
      try { importLibrary(JSON.parse(r.result)); }
      catch (err) { toast("导入失败：" + err.message); }
    };
    r.readAsText(f, "utf-8");
    t.value = "";
    return;
  }
  if (t.id === "fileProg" && t.files && t.files[0]) {
    const f = t.files[0], r = new FileReader();
    r.onload = () => {
      try { importProgress(JSON.parse(r.result)); }
      catch (err) { toast("导入失败：" + err.message); }
    };
    r.readAsText(f, "utf-8");
    t.value = "";
  }
}

function onAppInput(e) {
  const t = e.target;
  if (t.id === "typeIn" && Q.cur) {
    const v = t.value.toLowerCase(), a = String(Q.cur.answer).toLowerCase();
    t.classList.remove("bad", "good");
    if (!v) return;
    if (a.startsWith(v)) { if (v === a) t.classList.add("good"); }
    else t.classList.add("bad");
    return;
  }
  if (t.id === "libQ") {
    clearTimeout(LIB._t);
    LIB._t = setTimeout(() => {
      if (t !== document.getElementById("libQ")) return; // 旧输入框的定时器不要覆盖新值
      LIB.q = t.value;
      LIB.limit = 30;
      render();
      const el = $("#libQ");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 180);
    return;
  }
  if (t.id === "manualQ") {
    clearTimeout(MANUAL_UI._t);
    MANUAL_UI._t = setTimeout(() => {
      if (t !== document.getElementById("manualQ")) return;
      MANUAL_UI.q = t.value;
      render();
      const el = $("#manualQ");
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    }, 160);
  }
}

function onAppKeydown(e) {
  const t = e.target;
  if (t.id === "typeIn" && e.key === "Enter") {
    e.preventDefault();
    if (!Q.cur || Q.cur.answered) return;
    const v = t.value.trim().toLowerCase(), a = String(Q.cur.answer).toLowerCase();
    answer(v === a ? Q.cur.answer : "__WRONG__");
    return;
  }
  if (t.id === "lookupQ" && e.key === "Enter") { e.preventDefault(); doLookup(); return; }
  if (t.id === "libQ" && e.key === "Enter") {
    e.preventDefault(); LIB.q = t.value; LIB.limit = 30; render();
    return;
  }
  if (t.id === "manualQ" && e.key === "Enter") {
    e.preventDefault(); MANUAL_UI.q = t.value; render();
    return;
  }
  if ((t.id === "customNew" || t.id === "customReview") && e.key === "Enter") {
    e.preventDefault(); applyCustomLimits();
  }
}

function bindDynamic() {
  const app = $("#app");
  if (!app) return;
  app.onclick = onAppClick;
  app.onchange = onAppChange;
  app.oninput = onAppInput;
  app.onkeydown = onAppKeydown;
  // 打开“看全部义项”时暂停自动翻页，别把用户正在读的东西抽走
  app.querySelectorAll(".peek").forEach(d => {
    d.addEventListener("toggle", () => { if (d.open) clearTimeout(ADVANCE_TIMER); });
  });
}

/* ── 初始化 ─────────────────────────────────────────────── */
function init() {
  try { const t = localStorage.getItem("kb-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  // 只有部署在 http(s) 子页面时才显示“主页”，本地单文件打开不出现
  if (location.protocol === "http:" || location.protocol === "https:") {
    const h = $("#siteHome");
    if (h) h.hidden = false;
  }
  $("#themeBtn").addEventListener("click", () => {
    const n = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", n === "dark" ? "#14171b" : "#f6f4ef");
    try { localStorage.setItem("kb-theme", n); } catch (e) {}
  });
  $("#diagBtn").addEventListener("click", toggleDiag);
  $("#quickLookupBtn").addEventListener("click", openQuickLookup);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && MODAL) closeModal(); });
  document.querySelectorAll("#boards .board").forEach(b => b.addEventListener("click", () => setBoard(b.dataset.board)));
  render();
}

/* 全局函数给内联/调试用；页面本身主要走 data-act 委托 */
window.switchView = function (v) {
  if (v === "data") { MODE = "diag"; DIAG_TAB = "data"; render(); }
  else if (v === "lib") { MODE = "diag"; DIAG_TAB = "library"; render(); }
  else if (v === "predict") { MODE = "diag"; DIAG_TAB = "predict"; render(); }
  else { MODE = "study"; render(); }
};
window.startSession = startSession;
window.startPredict = startPredict;
window.openDiag = function (tab) { MODE = "diag"; DIAG_TAB = tab || "overview"; render(); };

init();

</script>
