<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>六级单词 · 义项级学习 0.3</title>
<meta name="description" content="一张卡，一个义项，一个动作。六级冲刺池 + 场景词汇，四种能力在后台记，进度只存本机。">
<style>
:root{
  color-scheme:light;
  --bg:#f6f4ef;--panel:#fffdf9;--panel2:#fbf8f2;--tx:#1e2329;--tx2:#545d68;--tx3:#8a929d;
  --line:#e5e0d5;--line2:#efebe2;--accent:#2f5fd0;--accent-bg:#edf2ff;--accent-ink:#24459a;
  --ok:#1d7a4c;--ok-bg:#e8f5ee;--warn:#9a5b00;--warn-bg:#fdf1dc;--bad:#b23a30;--bad-bg:#fbecea;
  --mark:#ffe680;--shadow:0 1px 2px rgba(40,35,25,.04),0 10px 30px rgba(40,35,25,.06);
  --shadow-lg:0 2px 6px rgba(40,35,25,.05),0 24px 60px rgba(40,35,25,.10);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC",serif;
  --radius:20px;
}
html[data-theme=dark]{
  color-scheme:dark;
  --bg:#14171b;--panel:#1c2026;--panel2:#191d22;--tx:#e8eaed;--tx2:#aab2bc;--tx3:#7d8792;
  --line:#2d333b;--line2:#252b32;--accent:#86a9ff;--accent-bg:#1d2940;--accent-ink:#a9c3ff;
  --ok:#75d6a0;--ok-bg:#173326;--warn:#ffc66d;--warn-bg:#362a16;--bad:#ff9b90;--bad-bg:#3a211e;
  --mark:#6b5a00;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.25);
  --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 28px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:15px;line-height:1.65;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--line2);padding:.1em .38em;border-radius:5px;font-size:.88em;font-family:ui-monospace,Consolas,monospace}
button,input,select,textarea{font:inherit}
button{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--mark);color:var(--tx)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
[hidden]{display:none!important}

/* ── 顶栏：两个板块并列，诊断退到右侧 ───────────────────── */
#topbar{position:fixed;inset:0 0 auto 0;z-index:50;height:60px;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{font-weight:750;font-size:15px;letter-spacing:.01em;white-space:nowrap;flex:0 0 auto;display:flex;align-items:baseline;gap:7px}
.brand small{font-size:10.5px;font-weight:500;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase}
#boards{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--line2);flex:0 0 auto;width:250px;min-width:0}
.board{appearance:none;border:0;background:transparent;color:var(--tx2);border-radius:9px;flex:1;text-align:center;
  padding:7px 16px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.16s}
.board:hover{color:var(--tx)}
.board.on{background:var(--panel);color:var(--tx);box-shadow:0 1px 3px rgba(30,25,15,.12)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ghostbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);
  border-radius:10px;height:34px;padding:0 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px}
.ghostbtn:hover{border-color:var(--accent);color:var(--accent)}
.ghostbtn .dotmark{width:5px;height:5px;border-radius:50%;background:var(--tx3)}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx2);
  width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:14px;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}

/* ── 学习页：中间一张卡 ─────────────────────────────────── */
#app{min-height:100vh}
.study{max-width:680px;margin:0 auto;padding:92px 18px 80px;display:flex;flex-direction:column;align-items:center}
.statusline{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;
  font-size:12px;color:var(--tx3);min-height:20px;margin:0 0 16px;letter-spacing:.01em}
.statusline b{color:var(--tx2);font-weight:600;font-variant-numeric:tabular-nums}
.statusline .sep{color:var(--line);padding:0 2px}
.todayflag{color:var(--ok);font-weight:600}
.todayflag::before{content:"·";color:var(--tx3);font-weight:400;margin-right:6px}

.studycard{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:26px 30px 22px;position:relative}
.studycard.lead{padding:38px 34px 30px;text-align:center;box-shadow:var(--shadow-lg)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:650}
.lead .eyebrow{margin-bottom:16px}
.lead h1{font-size:27px;line-height:1.45;letter-spacing:-.01em;margin:0 0 12px;font-weight:750}
.lead h1 b{font-variant-numeric:tabular-nums;color:var(--accent)}
.lead p{margin:0 auto 24px;max-width:420px;color:var(--tx2);font-size:13.5px;line-height:1.75}
.lead .quiet{color:var(--tx3);font-size:12.5px;margin-top:18px;margin-bottom:0}
.start-actions{display:flex;flex-direction:column;align-items:center;gap:12px}
.primary{appearance:none;border:0;background:var(--accent);color:#fff;border-radius:13px;
  min-height:50px;padding:0 34px;font-size:15.5px;font-weight:650;cursor:pointer;letter-spacing:.02em;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 26%,transparent);transition:.16s}
.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.primary:active{transform:none}
.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
html[data-theme=dark] .primary,
html[data-theme=dark] .chip[aria-pressed=true],
html[data-theme=dark] .ab.grad{color:#0d1524}
.textlink{appearance:none;border:0;background:none;color:var(--tx3);padding:4px 6px;font-size:12.5px;
  cursor:pointer;border-radius:6px;text-decoration:none}
.textlink:hover{color:var(--accent);text-decoration:none}
.textlink.amber:hover{color:var(--warn)}

/* 学习卡内部 */
.cardtop{display:flex;align-items:center;gap:10px;margin-bottom:20px;min-height:30px}
.kind{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent);background:var(--accent-bg);
  padding:3px 9px;border-radius:6px;white-space:nowrap}
.qprog{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.addbtn{margin-left:auto;appearance:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--tx3);font-size:19px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:.15s;flex:0 0 auto}
.addbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.addbtn.added{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line));font-size:14px;cursor:default}
.prompt{font-size:13px;color:var(--tx3);margin:0 0 4px}
.word{font-family:var(--serif);font-size:46px;line-height:1.15;letter-spacing:.005em;font-weight:600;
  margin:10px 0 10px;word-break:break-word}
.word.small{font-size:36px}
.clue{font-size:27px;line-height:1.45;font-weight:700;letter-spacing:.01em;margin:12px 0 10px;word-break:break-word}
.clue .pos{font-size:13px;color:var(--tx3);font-weight:500;margin-right:7px}
.hintline{font-size:12px;color:var(--tx3);margin:10px 0 0;letter-spacing:.02em}
.context{border-left:3px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;
  padding:10px 14px;margin:0 0 16px;font-size:13.5px;line-height:1.7;color:var(--tx2)}
.context.gen{border-left-color:var(--warn)}
.context .src{font-size:11px;color:var(--accent);margin-top:3px}
.context.gen .src{color:var(--warn)}

.options{display:grid;grid-template-columns:1fr;gap:9px;margin:20px 0 4px}
.option{appearance:none;text-align:left;display:flex;align-items:center;gap:12px;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:54px;cursor:pointer;
  font-size:14.5px;line-height:1.5;transition:.13s}
.option:hover{border-color:var(--accent);background:var(--accent-bg)}
.option .optkey{flex:0 0 24px;width:24px;height:24px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--tx3);font-weight:650}
.option.right{border-color:var(--ok);background:var(--ok-bg)}
.option.right .optkey{border-color:transparent;background:var(--ok);color:#fff}
.option.wrong{border-color:var(--bad);background:var(--bad-bg)}
.option.wrong .optkey{border-color:transparent;background:var(--bad);color:#fff}
.option:disabled{cursor:default}
.option:disabled:hover{filter:none}

.typebox{width:100%;height:54px;padding:0 16px;border:2px solid var(--line);border-radius:13px;
  background:var(--bg);color:var(--tx);font-size:20px;outline:none;letter-spacing:.05em;margin-top:18px;
  transition:border-color .15s}
.typebox:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.typebox.bad{border-color:var(--bad);color:var(--bad)}
.typebox.good{border-color:var(--ok);color:var(--ok)}

.feedback{display:none;margin-top:16px;padding:11px 14px;border-radius:11px;font-size:13.5px;line-height:1.65}
.feedback.on{display:block;animation:fb .18s ease-out}
@keyframes fb{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.no{background:var(--bad-bg);color:var(--bad)}
.feedback b{color:var(--tx)}
.feedback .sub{display:block;color:var(--tx3);font-size:12px;margin-top:2px}
.speakbtn{appearance:none;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);
  border-radius:12px;padding:12px 22px;font-size:15px;font-weight:650;cursor:pointer;letter-spacing:.02em}
.speakbtn:hover{background:color-mix(in srgb,var(--accent) 14%,var(--accent-bg))}
.cardfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:2px}
.cardfoot .spacer{margin-left:auto}
.nextbtn{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:9px;
  padding:7px 14px;font-size:12.5px;color:var(--tx2);cursor:pointer}
.nextbtn:hover{border-color:var(--accent);color:var(--accent)}

/* 折叠区：看全部义项 / 看四种能力 */
.peek{margin-top:18px;border-top:1px solid var(--line2);padding-top:0}
.peek summary{list-style:none;cursor:pointer;font-size:12px;color:var(--tx3);padding:12px 2px 2px;
  display:flex;align-items:center;gap:6px;user-select:none}
.peek summary::-webkit-details-marker{display:none}
.peek summary::after{content:"⌄";font-size:14px;transition:.2s;margin-left:2px;color:var(--tx3)}
.peek[open] summary::after{transform:rotate(180deg)}
.peek summary:hover{color:var(--accent)}
.detail{padding:12px 2px 2px;animation:fb .18s ease-out}
.detail-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:26px}
.detail h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin:0 0 9px;font-weight:650}
.sensebox{font-size:13px;line-height:1.75}
.sense-row{display:flex;gap:8px;padding:3px 7px;border-radius:6px;margin-left:-7px;align-items:baseline}
.sense-row.current{background:var(--accent-bg);color:var(--tx)}
.sense-row .pos{flex:0 0 42px;color:var(--tx3);font-size:11.5px}
.sense-row .items{color:var(--tx2)}
.sense-row.current .items{color:var(--tx);font-weight:600}
.exam-mini{margin-top:12px;padding:9px 12px;border-left:3px solid var(--accent);background:var(--bg);
  border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.7;color:var(--tx2)}
.exam-mini.gen{border-left-color:var(--warn)}
.exam-mini .src{font-size:10.5px;color:var(--accent);margin-top:2px}
.exam-mini.gen .src{color:var(--warn)}
.abrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;color:var(--tx2)}
.abrow .lab{flex:0 0 62px;color:var(--tx3)}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.dot.on1{background:var(--warn)}
.dot.on2{background:var(--ok)}
.abrow .statetxt{font-size:11px;color:var(--tx3);min-width:24px}
.abrow .wrongcount{margin-left:auto;font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.detail-note{font-size:11px;color:var(--tx3);margin:10px 0 0;line-height:1.65}

/* 完成页 */
.donecard{text-align:center;padding:40px 32px 32px}
.donecard .bignum{font-size:44px;font-weight:750;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px;
  font-variant-numeric:tabular-nums}
.donecard .bignum small{font-size:15px;font-weight:500;color:var(--tx3);margin-left:4px}
.donecard p{color:var(--tx2);font-size:13.5px;margin:8px auto 24px;max-width:380px}
.donecard .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── 场景页 ─────────────────────────────────────────────── */
.scene{max-width:1060px;margin:0 auto;padding:92px 22px 80px}
.scenehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}
.scenehead h1{font-size:30px;letter-spacing:-.02em;margin:0 0 6px;font-weight:750}
.scenehead p{margin:0;color:var(--tx2);font-size:13.5px;max-width:560px}
.switch{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--tx2);cursor:pointer;
  user-select:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:nowrap}
.switch input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.honest{font-size:11.5px;color:var(--tx3);line-height:1.75;margin:14px 0 22px;padding:10px 14px;
  border:1px dashed var(--line);border-radius:10px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.honest b{color:var(--tx2);font-weight:600}
.topicgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topic{appearance:none;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:4px;min-height:76px}
.topic:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.topic b{font-size:14px;font-weight:650;line-height:1.45;color:var(--tx)}
.topic span{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.topic.mine{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:var(--accent-bg)}
.topic.mine b{color:var(--accent)}
.topic.pinned b::after{content:"推荐";font-size:9.5px;color:var(--accent);background:var(--accent-bg);
  border-radius:4px;padding:1px 5px;margin-left:7px;vertical-align:1px;font-weight:600}
.topic:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.scenesep{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:650;
  margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.scenesep::after{content:"";height:1px;background:var(--line);flex:1}
.topicmore{appearance:none;border:1px dashed var(--line);background:transparent;border-radius:12px;
  padding:12px;color:var(--tx3);font-size:12.5px;cursor:pointer;grid-column:1/-1}
.topicmore:hover{color:var(--accent);border-color:var(--accent)}

.scenetop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
.scenetop h1{font-size:26px;margin:0;letter-spacing:-.02em}
.scenetop .count{font-size:12px;color:var(--tx3);margin-left:auto}
.scenetop .back{margin-left:0}
.scenebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.scenebar .note{font-size:11.5px;color:var(--tx3);margin-left:auto}
.scenelist{display:flex;flex-direction:column;gap:0;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;overflow:hidden}
.wrow{padding:13px 17px;border-bottom:1px solid var(--line2);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wrow:last-child{border-bottom:0}
.wrow .w{font-family:var(--serif);font-size:19px;font-weight:600;min-width:120px}
.wrow .g{color:var(--tx2);font-size:13px;flex:1;min-width:120px}
.wrow .badges{margin:0;flex:0 0 auto}
.wrow .togg{appearance:none;border:0;background:none;color:var(--tx3);font-size:11px;cursor:pointer;padding:3px 2px}
.wrow .togg:hover{color:var(--accent)}
.wdetail{flex:1 0 100%;padding:10px 0 2px 0;font-size:12.5px;color:var(--tx2)}

/* ── 诊断页 ─────────────────────────────────────────────── */
.diag{max-width:1080px;margin:0 auto;padding:92px 26px 90px}
.diaghead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.diaghead h1{font-size:30px;letter-spacing:-.02em;margin:0 0 5px;font-weight:750}
.diaghead .sub{color:var(--tx3);font-size:12.5px;margin:0}
.subnav{position:sticky;top:60px;z-index:30;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  padding:10px 0;margin:0 0 22px;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.subnav::-webkit-scrollbar{display:none}
.subnav button{appearance:none;border:0;background:transparent;color:var(--tx3);font-size:13px;
  padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:550}
.subnav button:hover{color:var(--tx);background:var(--line2)}
.subnav button.on{color:var(--accent);background:var(--accent-bg);font-weight:650}
.dsec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:14px}
.dsec h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.dsec h3{font-size:14px;margin:18px 0 6px}
.dsec .dsub{font-size:12px;color:var(--tx3);margin:0 0 16px}
.dsec p{font-size:13px;color:var(--tx2);margin:.55em 0}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 18px}
.statcard{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:13px 14px}
.statcard .num{font-size:26px;font-weight:750;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.statcard .num small{font-size:12px;color:var(--tx3);font-weight:500;margin-left:2px}
.statcard .lab{font-size:11px;color:var(--tx3);margin-top:2px}
.progress{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;margin:4px 0 8px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;width:0}
.abilitygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.abilitycard{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:13px 14px}
.abilitycard .t{font-size:12px;color:var(--tx3);margin-bottom:2px}
.abilitycard .v{font-size:23px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.2}
.abilitycard .v small{font-size:11px;color:var(--tx3);font-weight:500}
.abilitycard .bar{height:5px;margin-top:7px}
.abilitycard .bar i{background:var(--accent)}
.abilitycard .foot{font-size:10.5px;color:var(--tx3);margin-top:5px}

.heatwrap{overflow-x:auto;padding:4px 0 2px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);grid-auto-columns:12px;gap:3px;
  width:max-content}
.hcell{width:12px;height:12px;border-radius:3px;background:var(--line2);border:1px solid transparent}
.hcell.l1{background:color-mix(in srgb,var(--ok) 24%,var(--line2))}
.hcell.l2{background:color-mix(in srgb,var(--ok) 45%,var(--line2))}
.hcell.l3{background:color-mix(in srgb,var(--ok) 68%,var(--line2))}
.hcell.l4{background:var(--ok)}
.hcell.today{outline:1px solid var(--accent);outline-offset:1px}
.heatlegend{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--tx3);margin-top:9px}
.heatlegend .hcell{width:10px;height:10px}
.heatmonths{display:flex;gap:14px;font-size:10.5px;color:var(--tx3);margin-top:4px;white-space:nowrap}

.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;min-height:112px;margin:12px 0 4px}
.fcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:104px}
.fnum{font-size:11px;color:var(--tx2);font-variant-numeric:tabular-nums}
.fbar{width:100%;max-width:42px;background:var(--accent-bg);border-radius:5px 5px 2px 2px;min-height:3px;position:relative}
.fbar i{position:absolute;inset:auto 0 0 0;background:var(--accent);border-radius:5px 5px 2px 2px;display:block}
.fday{font-size:10.5px;color:var(--tx3);white-space:nowrap}
.fcol.today .fday{color:var(--accent);font-weight:650}

.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--tx3)}
.field select,.field input[type=number]{height:38px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--tx);padding:0 10px;font-size:13px;outline:none}
.field select:focus,.field input:focus{border-color:var(--accent)}
.field .help{font-size:10.5px;color:var(--tx3);line-height:1.5}

.searchbar{display:flex;gap:8px;margin:0 0 14px}
.searchbar input{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--tx);padding:0 13px;font-size:13.5px;outline:none;min-width:0}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.searchbar button{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;
  padding:0 16px;font-size:13px;cursor:pointer;white-space:nowrap}
.searchbar button:hover{border-color:var(--accent);color:var(--accent)}
.fgrp{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--tx2);border-radius:99px;
  padding:4px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.libmeta{font-size:11.5px;color:var(--tx3);margin:6px 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.libmeta .linkbtn{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;font-size:11.5px;padding:0}
.entry{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:13px 16px;margin-bottom:9px}
.e-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.e-top .w{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.01em}
.e-top .ph{color:var(--tx3);font-size:12px}
.e-top .pri-n{font-size:10.5px;color:var(--tx3);margin-left:auto;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 7px}
.bd{font-size:10.5px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--tx3);
  background:var(--panel);white-space:nowrap}
.bd.blue{background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.bd.warn{color:var(--warn)}.bd.ok{color:var(--ok)}.bd.bad{color:var(--bad)}
.senses{margin:6px 0;font-size:12.5px}
.sense{display:flex;gap:8px;padding:2px 0;align-items:baseline}
.sense .pos{color:var(--tx3);font-size:11px;min-width:42px;flex:0 0 auto}
.sense .items{color:var(--tx2)}
.exam{margin-top:7px;padding:8px 11px;border-left:3px solid var(--accent);background:var(--panel);
  border-radius:0 8px 8px 0;font-size:12.5px}
.exam .en{color:var(--tx)}
.exam .zh{color:var(--tx2);font-size:12px}
.exam .src{color:var(--accent);font-size:10.5px;margin-top:2px}
.exam.gen{border-left-color:var(--warn)}.exam.gen .src{color:var(--warn)}
.abilities{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center}
.ab{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--line2);color:var(--tx3)}
.ab.l1{background:var(--warn-bg);color:var(--warn)}
.ab.l2{background:var(--ok-bg);color:var(--ok)}
.ab.grad{background:var(--accent);color:#fff}
.mini{appearance:none;background:none;border:1px solid var(--line);border-radius:6px;color:var(--tx3);
  font-size:10.5px;padding:2px 7px;cursor:pointer;margin-left:auto}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;color:var(--tx3);padding:34px 0;font-size:13px;line-height:1.8}
.warnbox{border-left:3px solid var(--warn);background:var(--warn-bg);border-radius:0 9px 9px 0;
  padding:10px 13px;font-size:12px;color:var(--tx2);line-height:1.7;margin:10px 0}
.warnbox b{color:var(--tx)}
.tablewrap{overflow-x:auto;margin-top:8px}
.res-tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:480px}
.res-tbl th,.res-tbl td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:top}
.res-tbl th{color:var(--tx3);font-size:10.5px;font-weight:650;white-space:nowrap}
.res-tbl td b{color:var(--tx)}
.hit{color:var(--ok);font-weight:700}.miss{color:var(--bad);font-weight:700}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px}

/* 导入 */
#importSection{scroll-margin-top:130px}
.importbox{border:1px dashed var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;background:var(--bg)}
.importbox .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.importbox .hint{font-size:11px;color:var(--tx3);line-height:1.7;margin:8px 0 0}
.mapping{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.mapping .field label{font-size:11.5px}
.previewtbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--panel);border-radius:8px;overflow:hidden}
.previewtbl th,.previewtbl td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line2);max-width:220px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.previewtbl th{color:var(--tx3);font-size:10px}
.importactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* 预测 */
.predgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:7px;margin:12px 0}
.preditem{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;cursor:pointer;font-size:13px;min-width:0}
.preditem:hover{border-color:var(--accent)}
.preditem input{accent-color:var(--accent);margin:0;flex:0 0 auto}
.preditem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preditem .g{color:var(--tx3);font-size:10.5px;margin-left:auto;max-width:76px}

/* 查词 */
.lookupbox{max-width:680px}
.lookupresult{margin-top:16px}
.ydcard{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--bg)}
.ydhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ydhead .w{font-family:var(--serif);font-size:28px;font-weight:600}
.ydhead .phone{font-size:12px;color:var(--tx3)}
.ydtags{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.ydgroup{margin:10px 0 0;display:flex;gap:10px;font-size:13px;line-height:1.8}
.ydgroup .pos{flex:0 0 52px;color:var(--accent);font-size:11.5px;font-weight:650;padding-top:2px}
.ydgroup .items{color:var(--tx2)}
.ydwfs{font-size:11.5px;color:var(--tx3);margin-top:10px;line-height:1.7}
.ydsource{font-size:10.5px;color:var(--tx3);margin-top:10px}
.lookup-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.lookup-empty{font-size:12.5px;color:var(--tx3);margin-top:12px;line-height:1.8}
.localhits{margin-top:14px}
.localhit{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line2);font-size:13px}
.localhit:last-child{border-bottom:0}
.localhit .w{font-weight:650;min-width:96px}
.localhit .g{color:var(--tx2);flex:1}
.localhit .add{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:7px;
  font-size:10.5px;padding:3px 8px;cursor:pointer;color:var(--tx3);white-space:nowrap}
.localhit .add:hover{border-color:var(--accent);color:var(--accent)}

/* toast */
/* ── 0.3 学习卡：音标 / 反馈 / 能力点 / 标签 ─────────────── */
.phonetic{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 0 14px;color:var(--tx3);font-size:13px}
.phonetic .ph{font-family:ui-monospace,Consolas,monospace;letter-spacing:.02em}
.phonetic .speaker{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx3);
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;font-size:13px;padding:0}
.phonetic .speaker:hover{border-color:var(--accent);color:var(--accent)}
.phonetic.under-clue{margin-top:-2px;margin-bottom:10px}
.cardtag{font-size:10px;font-weight:650;color:var(--accent);background:var(--accent-bg);border-radius:5px;padding:2px 6px;white-space:nowrap}
.feedback .fb-main{font-size:14px;line-height:1.7}
.feedback .fb-row{display:flex;gap:8px;align-items:baseline;margin-top:5px;font-size:12.5px;color:var(--tx2)}
.feedback .fb-row .lab{flex:0 0 52px;color:var(--tx3);font-size:11px}
.feedback .fb-ex{margin-top:7px;padding-top:7px;border-top:1px solid color-mix(in srgb,var(--tx) 8%,transparent);
  font-size:12.5px;line-height:1.65;color:var(--tx2)}
.feedback .fb-ex .src{font-size:10.5px;color:var(--tx3);margin-top:2px}
.feedback .fb-back{display:block;margin-top:5px;font-size:11.5px;color:var(--bad)}
.abilityline{display:flex;flex-wrap:wrap;gap:7px 14px;align-items:center;margin-top:12px;padding-top:11px;
  border-top:1px dashed var(--line2);font-size:11px;color:var(--tx3)}
.abilityline .abgrp{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.abilityline .abdots{display:inline-flex;gap:2px}
.abilityline .abdot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.abilityline .abdot.on1{background:var(--warn)}
.abilityline .abdot.on2{background:var(--ok)}
.abilityline .abgrp.cur{color:var(--tx);font-weight:600}

/* ── 0.3 主页弹层：查词 / 今天学多少 / 挑词 ─────────────── */
body.modal-open{overflow:hidden}
.modalback{position:fixed;inset:0;z-index:70;background:rgba(20,22,26,.42);display:flex;align-items:center;
  justify-content:center;padding:18px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.modalpanel{width:min(680px,100%);max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow-lg);padding:20px 22px 18px}
.modalpanel.wide{width:min(760px,100%)}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.modalhead h3{font-size:17px;margin:0;letter-spacing:-.01em}
.modalclose{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--tx3);width:32px;height:32px;
  border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.modalclose:hover{border-color:var(--accent);color:var(--accent)}
.modalnote{font-size:11px;color:var(--tx3);line-height:1.7;margin:8px 0 0}
.modalfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
.modalfoot .spacer{margin-left:auto}
.modalpanel .ydcard{margin-top:10px}
.modalpanel .lookupresult{margin-top:10px}
.quickactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quickactions .primary,.quickactions .ghostbtn{min-height:38px;padding:0 16px;font-size:13px}
.quicklocal{margin-top:14px}
.quicklocal .localhit{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:12.5px;flex-wrap:wrap}
.quicklocal .localhit:last-child{border-bottom:0}
.quicklocal .w{font-weight:650;min-width:90px}
.quicklocal .g{color:var(--tx2);flex:1;min-width:100px}
.quicklocal .mini-actions{display:flex;gap:5px;margin-left:auto}
.quicklocal .mini-actions button{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:7px;
  color:var(--tx3);font-size:10.5px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.quicklocal .mini-actions button:hover{border-color:var(--accent);color:var(--accent)}

.limitblock{padding:12px 0 4px;border-bottom:1px solid var(--line2)}
.limitblock:last-of-type{border-bottom:0}
.limitblock h4{font-size:12px;color:var(--tx3);margin:0 0 8px;font-weight:600;letter-spacing:.04em}
.limitpresets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.limitbtn{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--tx2);border-radius:8px;
  min-width:44px;height:34px;padding:0 10px;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.limitbtn:hover{border-color:var(--accent);color:var(--accent)}
.limitbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme=dark] .limitbtn.on{color:#0d1524}
.customrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--tx3)}
.customrow input{width:92px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  color:var(--tx);padding:0 9px;font-size:13px;outline:none;font-variant-numeric:tabular-nums}
.customrow input:focus{border-color:var(--accent)}
.customrow button{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;height:34px;
  padding:0 12px;font-size:12px;color:var(--tx2);cursor:pointer}
.customrow button:hover{border-color:var(--accent);color:var(--accent)}
.limitwarn{font-size:11px;color:var(--warn);margin-top:7px;line-height:1.6}

.manualmeta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--tx3);margin:10px 0 6px}
.manualmeta b{color:var(--tx);font-variant-numeric:tabular-nums}
.manualmeta .warn{color:var(--warn)}
.manuallist{max-height:44vh;overflow:auto;border:1px solid var(--line2);border-radius:10px;background:var(--bg)}
.manualrow{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:12.5px}
.manualrow:last-child{border-bottom:0}
.manualrow:hover{background:var(--panel)}
.manualrow input{width:16px;height:16px;accent-color:var(--accent);margin:0;flex:0 0 auto}
.manualrow .w{font-weight:650;min-width:96px}
.manualrow .g{color:var(--tx2);flex:1;min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.manualrow .bd{font-size:10px}
.manualrow.disabled{opacity:.55;cursor:not-allowed}
.manualrow.disabled:hover{background:transparent}
.manualempty{padding:26px 12px;text-align:center;color:var(--tx3);font-size:12.5px}
.manualfile{display:none}

.statusline .textlink{font-size:11px;padding:0 2px}
.lead-links{display:flex;gap:6px 14px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.lead-links .textlink{font-size:12px}

/* ── 0.3 响应式补充 ─────────────────────────────────────── */
@media(max-width:680px){
  .modalback{padding:10px;align-items:flex-start;padding-top:76px}
  .modalpanel{max-height:calc(100vh - 90px);padding:16px 14px 14px;border-radius:14px}
  .modalpanel.wide{width:100%}
  .manuallist{max-height:46vh}
  .phonetic{font-size:12px}
  .abilityline{gap:6px 10px;font-size:10.5px}
  .statusline .textlink{font-size:10.5px}
  .top-actions{gap:6px}
  .top-actions .ghostbtn{padding:0 9px}
}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
  background:var(--tx);color:var(--bg);padding:9px 17px;border-radius:10px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.2s;z-index:80;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 响应式 */
@media(min-width:900px){
  .study{min-height:calc(100vh - 60px);justify-content:center;padding-top:60px;padding-bottom:60px}
}
@media(max-width:900px){
  .topicgrid{grid-template-columns:repeat(2,1fr)}
  .detail-grid{grid-template-columns:1fr;gap:16px}
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .abilitygrid{grid-template-columns:repeat(2,1fr)}
  .settings{grid-template-columns:1fr 1fr}
  .scene,.diag,.study{padding-left:16px;padding-right:16px}
}
@media(max-width:680px){
  #topbar{height:auto;min-height:104px;padding:8px 12px 9px;flex-wrap:wrap;gap:8px 10px}
  .brand{font-size:14px}
  .brand small{display:none}
  #boards{order:3;flex:1 0 100%;width:100%}
  .board{flex:1;text-align:center;padding:8px 10px}
  .top-actions{margin-left:auto}
  .study{padding-top:126px;padding-bottom:60px}
  .scene,.diag{padding-top:126px}
  .studycard{padding:20px 18px 18px;border-radius:17px}
  .studycard.lead{padding:30px 20px 24px}
  .lead h1{font-size:22px}
  .word{font-size:38px}
  .word.small{font-size:31px}
  .clue{font-size:23px}
  .option{min-height:56px;font-size:14px}
  .subnav{top:104px}
  .diaghead h1,.scenehead h1{font-size:25px}
  .topicgrid{grid-template-columns:1fr 1fr;gap:8px}
  .topic{padding:12px;min-height:72px}
  .topic b{font-size:13px}
  .statgrid,.abilitygrid{grid-template-columns:1fr 1fr}
  .settings{grid-template-columns:1fr}
  .dsec{padding:18px 16px;border-radius:14px}
  .heat{grid-template-rows:repeat(7,11px);grid-auto-columns:11px;gap:2px}
  .hcell{width:11px;height:11px}
  .scenehead{align-items:flex-start}
  .scenetop{gap:6px 10px}
  .scenetop .back{order:-1;flex:0 0 100%;margin-left:0;text-align:left;padding-left:0}
  .scenetop h1{font-size:22px}
  .scenetop .count{margin-left:0}
  .scenebar .note{margin-left:0}
  .wrow .w{min-width:0;font-size:18px}
  .wrow .g{flex:1 0 100%;order:3;font-size:12.5px}
  .wrow .badges{order:2;margin-left:auto}
  .mapping{grid-template-columns:1fr}
}
@media(max-width:400px){
  .board{font-size:12.5px;padding:8px 4px}
  .studycard{padding:18px 14px 16px}
  .options{gap:7px}
  .option{padding:11px 12px}
  .statgrid,.abilitygrid{grid-template-columns:1fr 1fr}
  .topicgrid{grid-template-columns:1fr}
}
/* 诊断模式：顶栏只留返回 + 主题 */
body.diagmode #topbar{min-height:60px}
@media(max-width:680px){
  body.diagmode #topbar{min-height:60px;padding:8px 12px;flex-wrap:nowrap}
  body.diagmode .diag{padding-top:82px}
  body.diagmode .subnav{top:60px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .primary:hover,.topic:hover{transform:none}
}

<body>

<header id="topbar">
  <div class="brand">六级单词<small>义项级 0.3</small></div>
  <nav id="boards" aria-label="学习板块">
    <button type="button" class="board on" data-board="sprint">六级冲刺池</button>
    <button type="button" class="board" data-board="scene">场景词汇</button>
  </nav>
  <div class="top-actions">
    <button type="button" class="ghostbtn" id="quickLookupBtn" aria-label="查词">查词</button>

/* ═══════════════════════════════════════════════════════════
   六级单词 0.2 · 义项级学习
   第一层：一张卡，一个义项，一个动作
   第二层：折叠的义项 / 四种能力
   第三层：诊断页（词库、预测、数据、热力图、查词、导入导出）
   数据层：RAW 原样保留；PROG 的结构与四维记分逻辑不变。
   ═══════════════════════════════════════════════════════════ */

let DATA = RAW.entries.slice();
const META = RAW.meta;

/* ── 个人状态：只存本地 ─────────────────────────────────── */
const KEY = "cet6-sense-v01";              // 旧版进度，继续沿用，结构不改
const XKEY = "cet6-sense-v01-extras";      // 调度/日志/我的词库/设置
const ABILITIES = ["read", "listen", "write", "sense"];
const AB_LABEL = { read: "阅读识别", listen: "听力辨音", write: "写译召回", sense: "义项辨析" };
const AB_SHORT = { read: "阅读", listen: "听力", write: "写译", sense: "义项" };
const DAY = 86400000;
const DEFAULT_SETTINGS = { newLimit: 6, reviewLimit: 12, sceneBatch: 10 };

let PROG = {};
let HISTORY = [];
let SCHED = {};        // id -> {i:间隔天数, d:到期时间, l:上次作答, first:首次日期, s:连续正确}
let LOG = {};          // "YYYY-MM-DD" -> 义项回忆次数
let MY = [];           // 我的词库 id
let MYWORDS = [];      // 行外添加/导入的自定义词条
let SETTINGS = { ...DEFAULT_SETTINGS };
let MANUAL = { day: "", ids: [], quick: [] }; // 仅今天有效的手动新词队列
let MODAL = null;      // null | {type:"lookup"|"limits"|"manual"}
let MANUAL_UI = { q: "", onlyUngrad: true };
let QL = { pending: false }; // 主页查词：是否已点“加入我的词库”，等待二选一

try {
  const s = JSON.parse(localStorage.getItem(KEY) || "{}");
  PROG = s.prog || {};
  HISTORY = Array.isArray(s.history) ? s.history : [];
} catch (e) {}

try {
  const x = JSON.parse(localStorage.getItem(XKEY) || "{}");
  SCHED = x.sched && typeof x.sched === "object" ? x.sched : {};
  LOG = x.log && typeof x.log === "object" ? x.log : {};
  MY = Array.isArray(x.my) ? x.my : [];
  MYWORDS = Array.isArray(x.mywords) ? x.mywords.filter(w => w && w.id && w.w) : [];
  SETTINGS = { ...DEFAULT_SETTINGS, ...(x.settings || {}) };
  if (x.manual && typeof x.manual === "object") {
    MANUAL = {
      day: String(x.manual.day || ""),
      ids: Array.isArray(x.manual.ids) ? [...new Set(x.manual.ids.filter(Boolean))] : [],
      quick: Array.isArray(x.manual.quick) ? [...new Set(x.manual.quick.filter(Boolean))] : []
    };
  }
} catch (e) {}

/* 自定义词条并回 DATA；PROG 不动 */
(function mergeMyWords() {
  const ids = new Set(DATA.map(d => d.id));
  MYWORDS.forEach(w => {
    w.custom = true;
    if (!ids.has(w.id)) { DATA.push(w); ids.add(w.id); }
    if (!MY.includes(w.id)) MY.push(w.id);
  });
  MY = MY.filter(id => DATA.some(d => d.id === id));
  const today = dayKey();
  if (MANUAL.day !== today) MANUAL = { day: today, ids: [], quick: [] };
  MANUAL.ids = [...new Set(MANUAL.ids)].filter(id => DATA.some(d => d.id === id));
  MANUAL.quick = [...new Set(MANUAL.quick)].filter(id => DATA.some(d => d.id === id));
  Object.keys(SCHED).forEach(id => {
    const s = SCHED[id];
    if (!s || typeof s !== "object" || typeof s.d !== "number") delete SCHED[id];
  });
})();

/* ── 存储 ────────────────────────────────────────────────── */
function clampNew(v, fallback) {
  const n = Number(v);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(1, Math.min(100, Math.floor(n)));
}
function clampReview(v, fallback) {
  const n = Number(v);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(0, Math.min(200, Math.floor(n)));
}
function normalizeSettings() {
  SETTINGS.newLimit = clampNew(SETTINGS.newLimit, DEFAULT_SETTINGS.newLimit);
  SETTINGS.reviewLimit = clampReview(SETTINGS.reviewLimit, DEFAULT_SETTINGS.reviewLimit);
  if (![6, 10, 15, 20].includes(SETTINGS.sceneBatch)) SETTINGS.sceneBatch = DEFAULT_SETTINGS.sceneBatch;
}
normalizeSettings();

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ prog: PROG, history: HISTORY.slice(-40) }));
    localStorage.setItem(XKEY, JSON.stringify({
      sched: SCHED, log: LOG, my: MY, mywords: MYWORDS, settings: SETTINGS, manual: MANUAL
    }));
  } catch (e) {
    toast("本地存储写入失败，可能是浏览器空间满了");
  }
}

function blank() {
  return { read: 0, listen: 0, write: 0, sense: 0, wrong: { read: 0, listen: 0, write: 0, sense: 0 }, seen: 0, grad: false };
}
function P(id) { if (!PROG[id]) PROG[id] = blank(); return PROG[id]; }
function wrongTotal(id) {
  const p = PROG[id];
  if (!p) return 0;
  return ABILITIES.reduce((a, k) => a + ((p.wrong && p.wrong[k]) || 0), 0);
}
function isGrad(id) { return !!(PROG[id] && PROG[id].grad); }
function dynamicPri(d) { return (d.pri || 0) + wrongTotal(d.id) * 6 + (d.familiar ? 4 : 0); }
function isMy(id) {
  if (MY.includes(id)) return true;
  const d = DATA.find(x => x.id === id);
  return !!(d && d.custom);
}
function needsMeaning(d) {
  return !!(d && d.w && (d.gloss || (d.senses || []).some(s => (s.items || []).length)));
}
function isBasicWord(d) {
  const c = (d.cefr || "").toUpperCase();
  if (c === "A1" || c === "A2" || c === "B1") return true;
  return !!d.collins && parseInt(d.collins, 10) >= 4;
}

/* ── 今日手动队列（只存今天，不写 SCHED） ───────────────── */
function ensureManualDay() {
  const today = dayKey();
  if (!MANUAL.day || MANUAL.day !== today) {
    MANUAL = { day: today, ids: [], quick: [] };
  }
}
function manualIds() {
  ensureManualDay();
  return MANUAL.ids.filter(id => DATA.some(d => d.id === id));
}
function isManual(id) { return manualIds().includes(id); }
function isQuickTagged(id) { ensureManualDay(); return MANUAL.quick.includes(id); }
function answeredToday(id) {
  const s = SCHED[id];
  return !!(s && dayKey(s.l) === dayKey());
}
function manualCapacityLeft() {
  return Math.max(0, SETTINGS.newLimit - todayNewCount() - manualIds().length);
}
function addManual(id, front) {
  ensureManualDay();
  MANUAL.ids = MANUAL.ids.filter(x => x !== id);
  if (front) MANUAL.ids.unshift(id); else MANUAL.ids.push(id);
}
function removeManual(id) {
  ensureManualDay();
  MANUAL.ids = MANUAL.ids.filter(x => x !== id);
  MANUAL.quick = MANUAL.quick.filter(x => x !== id);
}

/* ── 日期 / 调度 ─────────────────────────────────────────── */
function dayKey(ts) {
  const d = new Date(ts == null ? Date.now() : ts);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function startOfDay(ts) {
  const d = new Date(ts == null ? Date.now() : ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}
function todayNewCount() {
  const k = dayKey();
  return Object.keys(SCHED).filter(id => SCHED[id].first === k).length;
}
function todayReviewCount() {
  const k = dayKey();
  return Object.keys(SCHED).filter(id => SCHED[id].first !== k && dayKey(SCHED[id].l) === k).length;
}
function todayAnswered() { return LOG[dayKey()] || 0; }

function isDue(id, now) {
  if (isGrad(id)) return false;
  const s = SCHED[id];
  if (s) return s.d <= (now || Date.now());
  const p = PROG[id];
  return !!(p && p.seen > 0); // 旧版进度：没有排程记录，先当作今天到期
}

/* 简化 SM-2：
   错 → 1 天；四项全稳 → 30 天；任何一项为 0 → 1 天；
   其余按连续正确的倍数拉长，封顶 30 天。
   排程只读 PROG 的四维档位，不写回 PROG 的结构。 */
function updateSched(id, ok, p) {
  const now = Date.now();
  let s = SCHED[id];
  if (!s) s = { i: 0, d: 0, l: 0, first: null, s: 0 };
  if (!s.first) s.first = dayKey(now);
  if (ok) {
    s.s = (s.s || 0) + 1;
    if (ABILITIES.every(k => (p[k] || 0) >= 2)) s.i = 30;
    else if (ABILITIES.some(k => (p[k] || 0) === 0)) s.i = 1;
    else s.i = Math.min(30, Math.max(2, Math.round((s.i || 1) * 1.8)));
  } else {
    s.s = 0;
    s.i = 1;
  }
  s.l = now;
  s.d = now + s.i * DAY;
  SCHED[id] = s;
}

function reviewScore(id) {
  const s = SCHED[id];
  const p = PROG[id] || blank();
  const late = s ? Math.max(0, (Date.now() - s.d) / DAY) : 15;
  const weakness = 8 - ABILITIES.reduce((a, k) => a + Math.min(2, p[k] || 0), 0);
  return (1 + Math.min(late, 60)) * (1 + weakness) + wrongTotal(id) * 2;
}

/* ── 冲刺池 ─────────────────────────────────────────────── */
/* 现有字段不足以严格只取 CEFR B2+（859 个 cet6 词没有 CEFR）。
   按用户允许的近似规则：cet6=true，剔除 A1–A2 且柯林斯 5 星；
   剩余按真题词频与动态优先级排序。毕业词永久过滤。 */
function isSprintWord(d) {
  if (!d || d.custom || !d.cet6) return false;
  const c = (d.cefr || "").toUpperCase();
  if ((c === "A1" || c === "A2") && String(d.collins) === "5") return false;
  return true;
}
function sprintPool() {
  return DATA.filter(d => isSprintWord(d) && !isGrad(d.id) && needsMeaning(d));
}

function buildTodayQueue(opts) {
  opts = opts || {};
  ensureManualDay();
  const now = Date.now();
  const pool = sprintPool();

  // 手动队列里的词优先；只收未毕业、今天还没作答、还有释义的词。
  // 手动队列计入今日新词额度，超出部分不进入本轮。
  const availableNew = Math.max(0, SETTINGS.newLimit - todayNewCount());
  const manual = manualIds()
    .map(id => DATA.find(d => d.id === id))
    .filter(d => d && needsMeaning(d) && !isGrad(d.id) && !answeredToday(d.id))
    .slice(0, availableNew);
  const manualSet = new Set(manual.map(d => d.id));

  // 到期复习：手动队列里的词从复习队列剔除，避免同一天出现两次。
  const reviewLeft = Math.max(0, SETTINGS.reviewLimit - todayReviewCount());
  let reviews = pool.filter(d => isDue(d.id, now) && !manualSet.has(d.id));
  reviews.sort((a, b) => reviewScore(b.id) - reviewScore(a.id));
  reviews = reviews.slice(0, reviewLeft);

  // 系统新词 = 今日新词额度 − 手动队列已占用的部分。
  const systemNewLeft = Math.max(0, availableNew - manual.length);
  let fresh = pool.filter(d => !SCHED[d.id] && !(PROG[d.id] && PROG[d.id].seen > 0) && !manualSet.has(d.id));
  fresh.sort((a, b) => dynamicPri(b) - dynamicPri(a));
  fresh = fresh.slice(0, systemNewLeft);

  if (opts.skipReview) reviews = [];
  return {
    manual, reviews, news: fresh,
    newTotal: manual.length + fresh.length,
    ids: [...manual, ...reviews, ...fresh].map(d => d.id)
  };
}
// 兼容旧调用点
function buildSprintQueue(opts) { return buildTodayQueue(opts); }

/* ── 出题池 ─────────────────────────────────────────────── */
let POOL_SENSE = [], POOL_GLOSS = [], POOL_WORD = [];
function rebuildPools() {
  POOL_SENSE.length = 0; POOL_GLOSS.length = 0; POOL_WORD.length = 0;
  DATA.forEach(d => {
    (d.senses || []).forEach(s => (s.items || []).forEach(t => {
      if (t && t.length <= 60) POOL_SENSE.push({ t, w: d.w, id: d.id });
    }));
    if (d.gloss) POOL_GLOSS.push({ t: d.gloss, id: d.id });
    if (d.w) POOL_WORD.push({ t: d.w, id: d.id });
  });
}
rebuildPools();

function pickSense(d) {
  const all = [];
  (d.senses || []).forEach(s => (s.items || []).forEach(item => {
    if (item) all.push({ pos: s.pos || "", item });
  }));
  return all.length ? pick(all) : null;
}

/* 默认题型：
   1) 从没见过的词 → 阅读识别（先建立形义联结，直接默写等于猜）
   2) 见过的词 → 四项里最弱的一项；并列时输出优先：写译 > 义项 > 听力 > 阅读
   3) 该题型缺素材时回退，不硬出 */
function chooseKind(d) {
  const p = P(d.id);
  let kind;
  if (!p.seen) {
    kind = "read";
  } else {
    const min = Math.min(...ABILITIES.map(k => p[k] || 0));
    const weak = ABILITIES.filter(k => (p[k] || 0) === min);
    kind = ["write", "sense", "listen", "read"].find(k => weak.includes(k)) || "read";
  }
  const hasSense = (d.senses || []).some(s => (s.items || []).length);
  const hint = d.gloss || ((d.senses || [])[0]?.items || [])[0] || "";
  if (kind === "sense" && !hasSense) kind = hint ? "write" : "read";
  if (kind === "write" && !hint) kind = hasSense ? "sense" : "read";
  if (kind === "read" && !hint && hasSense) kind = "sense";
  return kind;
}

function distract(pool, id, n, correct, extra) {
  const out = [];
  const used = new Set([correct].concat(extra || []));
  const c = shuffle(pool);
  for (const x of c) {
    if (out.length >= n) break;
    if (x.id !== id && !used.has(x.t)) { used.add(x.t); out.push(x.t); }
  }
  return out;
}

function makeQ(d) {
  const p = P(d.id);
  let kind = chooseKind(d);
  const fallback = (d.senses || [])[0]?.items?.[0] || "";
  const hint = d.gloss || fallback || "";
  let q = { kind, d, hint, opts: [], answer: "", title: "", prompt: "", target: null };

  if (kind === "read") {
    const cor = d.gloss || hint || d.w;
    const own = (d.senses || []).flatMap(s => s.items || []);
    q.prompt = "看到这个词，选它的意思";
    q.answer = cor;
    q.opts = shuffle([cor, ...distract(POOL_GLOSS, d.id, 3, cor, own)]);
    q.target = { pos: "", item: cor };
  } else if (kind === "sense") {
    const all = (d.senses || []).flatMap(s => s.items || []).filter(Boolean);
    const t = pickSense(d) || { pos: "", item: pick(all) || "" };
    q.prompt = "下面哪个义项属于这个词";
    q.answer = t.item;
    q.target = t;
    const others = all.filter(x => x !== t.item);
    q.opts = shuffle([...new Set([t.item, ...distract(POOL_SENSE, d.id, 3, t.item, others)])]);
  } else if (kind === "listen") {
    q.prompt = "听一听，是哪个词";
    q.answer = d.w;
    q.opts = shuffle([d.w, ...distract(POOL_WORD, d.id, 3, d.w)]);
    q.target = pickSense(d) || { pos: "", item: hint };
  } else {
    q.prompt = "给中文，敲出英文";
    q.answer = d.w;
    q.hint = hint;
    q.target = pickSense(d) || { pos: "", item: hint };
  }
  return q;
}

/* ── 全局状态 ───────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function toast(m) {
  const e = $("#toast");
  if (!e) return;
  e.textContent = m;
  e.classList.add("on");
  clearTimeout(e._t);
  e._t = setTimeout(() => e.classList.remove("on"), 2200);
}
function safeUrl(u) {
  try { const x = new URL(u); return (x.protocol === "http:" || x.protocol === "https:") ? esc(u) : ""; } catch (e) { return ""; }
}
function hl(t) {
  const s = esc(t);
  const q = (LIB.q || "").trim();
  if (!q) return s;
  try { return s.replace(new RegExp("(" + escRe(esc(q)) + ")", "gi"), "<mark>$1</mark>"); } catch (e) { return s; }
}
function speak(w) {
  if (!("speechSynthesis" in window)) { toast("这个浏览器不支持语音合成"); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(w);
    u.lang = "en-US";
    u.rate = .85;
    speechSynthesis.speak(u);
  } catch (e) { toast("发音失败：" + e.message); }
}

let MODE = "study";            // study | diag
let BOARD = "sprint";          // sprint | scene
let DIAG_TAB = "overview";
let SCENE = { topic: "", basicOnly: false, showAll: false };
let LIB = { q: "", tag: new Set(), st: new Set(), limit: 30, _t: null };
let CSV_IMPORT = null;

const LOOKUP_CACHE = new Map();
let LAST_LOOKUP_AT = 0;

let PRED = { active: false, ids: [], sys: [], user: [], done: [] };

/* ── 状态栏 ─────────────────────────────────────────────── */
function statusLine() {
  const q = buildTodayQueue();
  const today = todayAnswered() ? '<span class="todayflag">今天记下了</span>' : "";
  return `<div class="statusline">今日新词 <b>${q.newTotal}</b> 个<span class="sep">·</span>到期复习 <b>${q.reviews.length}</b> 个${today}<span class="sep">·</span><button type="button" class="textlink" data-act="limits-open">今天学多少</button></div>`;
}

/* ── 学习页 ─────────────────────────────────────────────── */
function renderStudy() {
  const status = statusLine();
  let body = "";
  if (Q.active && Q.mode === "sprint") {
    body = Q.i >= Q.items.length ? doneHtml() : quizHtml();
    return `<div class="study">${status}${body}</div>`;
  }
  const q = buildTodayQueue();
  if (!q.ids.length) return `<div class="study">${status}${emptyQueueHtml()}</div>`;
  const reviewN = q.reviews.length, newN = q.newTotal;
  let head = "";
  if (q.manual.length) head = `今天你挑了 <b>${q.manual.length}</b> 个词，先做这些。`;
  else if (reviewN && newN) head = `先复习 <b>${reviewN}</b> 张，再学 <b>${newN}</b> 个新词。`;
  else if (reviewN) head = `今天有 <b>${reviewN}</b> 张到期复习。`;
  else head = `今天学 <b>${newN}</b> 个新词。`;
  return `<div class="study">${status}
    <div class="studycard lead">
      <div class="eyebrow">六级冲刺池 · 系统安排</div>
      <h1>${head}</h1>
      <p>打开就做，不用选。做错会拉回近期，做对会拉远。四种能力在后台各自记，这一张只练一项。</p>
      <div class="start-actions">
        <button type="button" class="primary" data-act="start">${todayAnswered() ? "继续" : "开始"}</button>
      </div>
      <div class="lead-links">
        ${reviewN ? '<button type="button" class="textlink" data-act="skip">跳过复习，只学新词</button>' : ""}
        <button type="button" class="textlink" data-act="manual-open">挑今天要学的词</button>
      </div>
      <p class="quiet">今日额度：新词 ${SETTINGS.newLimit} · 复习 ${SETTINGS.reviewLimit} · <button type="button" class="textlink" data-act="limits-open">调整</button></p>
    </div>
  </div>`;
}

function emptyQueueHtml() {
  const dueLeft = sprintPool().filter(d => isDue(d.id)).length;
  const newLeft = Math.max(0, SETTINGS.newLimit - todayNewCount());
  if (dueLeft > 0) {
    return `<div class="studycard lead">
      <div class="eyebrow">六级冲刺池</div>
      <h1>今天的复习额度用完了。</h1>
      <p>还有 ${dueLeft} 个到期词在队列里，按你定的 ${SETTINGS.reviewLimit} 个复习上限，今天不再往这里加。想多学可以去场景词汇，或者去诊断把额度调大。</p>
      <div class="start-actions"><button type="button" class="primary" data-act="go-scene">去场景词汇</button>
      <button type="button" class="textlink" data-act="go-diag">去诊断调额度</button></div>
    </div>`;
  }
  return `<div class="studycard lead">
    <div class="eyebrow">六级冲刺池</div>
    <h1>这一队清完了。</h1>
    <p>今天没有到期复习，也没有新词额度了。断两天回来，队列会按超期程度自己补上，不会归零，也没有红字。</p>
    <div class="start-actions"><button type="button" class="primary" data-act="go-scene">去场景词汇</button>
    <button type="button" class="textlink" data-act="go-diag">看看诊断</button></div>
  </div>`;
}

function startSession(skipReview) {
  if (Q.active && Q.mode === "sprint" && Q.i < Q.items.length) { render(); return; }
  if (Q.active && Q.mode === "scene" && Q.i < Q.items.length) {
    if (!confirm("开始冲刺练习会结束当前场景这一轮（已经答过的都已保存）。继续？")) return;
  }
  const q = buildTodayQueue({ skipReview: !!skipReview });
  if (!q.ids.length) {
    toast(skipReview ? "今天没有可学的新词额度了" : "今天没有可做的卡了");
    render();
    return;
  }
  PRED = { active: false, ids: [], sys: [], user: [], done: [] };
  Q = {
    active: true, board: "sprint", mode: "sprint",
    items: q.ids.map(id => DATA.find(d => d.id === id)).filter(Boolean),
    i: 0, cur: null, wrong: [], results: [], fromPredict: false, final: null,
    reviewN: q.reviews.length, manualN: q.manual.length, sceneTitle: ""
  };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function phoneticRow(d, withSpeaker) {
  const ph = d.ph ? `/${esc(d.ph)}/` : "";
  if (!ph && !withSpeaker) return "";
  return `<div class="phonetic">${ph ? `<span class="ph">${ph}</span>` : ""}
    ${withSpeaker ? '<button type="button" class="speaker" data-act="speak" aria-label="播放发音" title="播放发音">🔊</button>' : ""}</div>`;
}

function abilityLine(d, kind) {
  const p = PROG[d.id] || blank();
  return `<div class="abilityline">${ABILITIES.map(k => {
    const lv = p[k] || 0;
    return `<span class="abgrp ${k === kind ? "cur" : ""}">${AB_SHORT[k]}
      <span class="abdots"><span class="abdot ${lv >= 1 ? "on1" : ""}"></span><span class="abdot ${lv >= 2 ? "on2" : ""}"></span></span></span>`;
  }).join("")}</div>`;
}

function quizHtml() {
  const d = Q.items[Q.i];
  if (!d) { Q.i = Q.items.length; return doneHtml(); }
  if (!Q.cur || Q.cur.d.id !== d.id) Q.cur = makeQ(d);

    ? `${esc(Q.sceneTitle || "场景")} · 第 ${Q.i + 1} / ${Q.items.length} 张`

  const addBtn = isMy(d.id)
    ? `<button type="button" class="addbtn added" title="已在你的词库" aria-label="已在你的词库">✓</button>`

  let body = "";
  if (q.kind === "write") {
    body = `<div class="prompt">${q.prompt}</div>
      <div class="clue">${hl(q.hint)}</div>
      ${phoneticRow(d, true)}

      <div class="hintline">提示：${esc(d.w[0])}… · 共 ${d.w.length} 个字母</div>`;

      <div class="options">${q.opts.map((o, i) => optionHtml(o, i, q, answered)).join("")}</div>`;

  return `<div class="studycard qcard" id="quizcard">
    <div class="cardtop">
      <span class="kind">${AB_LABEL[q.kind]}</span>
      ${d.custom || isQuickTagged(d.id) ? '<span class="cardtag">自定义</span>' : ""}
      <span class="qprog">${prog}${Q.fromPredict ? " · 预测轮" : ""}</span>
      ${addBtn}
    </div>
    ${body}
    ${feedbackHtml(q, answered)}
    <div class="cardfoot">
      ${answered
        ? `<span class="hintline">答案已记下</span><span class="spacer"></span><button type="button" class="nextbtn" data-act="next">下一题 →</button>`
        : `<button type="button" class="textlink amber" data-act="stuck">我卡住了</button><span class="spacer"></span><span class="hintline">想不起来就点它，算一次没想起来</span>`}
    </div>
    ${abilityLine(d, q.kind)}
    ${detailHtml(d, q)}
  </div>`;
}

function optionHtml(o, i, q, answered) {
  let cls = "option";
  if (answered) {
    if (o === q.answer) cls += " right";
    else if (o === q.given) cls += " wrong";
  }
  return `<button type="button" class="${cls}" data-act="opt" data-opt="${esc(o)}" ${answered ? "disabled" : ""}>
    <span class="optkey">${"ABCD"[i] || ""}</span><span>${hl(o)}</span></button>`;
}

function feedbackHtml(q, answered) {
  if (!answered) return `<div class="feedback" id="fb"></div>`;
  const ok = !!q.ok;
  const d = q.d;
  const right = q.kind === "read" || q.kind === "sense" ? q.answer : d.w;
  const target = q.target || { pos: "", item: q.answer };
  const example = d.exam || d.gen;
  const exLabel = d.exam ? "真题原句" : "生成短句，非真题";
  const exSrc = d.exam ? [d.exam.src, d.examKind].filter(Boolean).join(" · ") : (d.gen && d.gen.src) || "";
  return `<div class="feedback on ${ok ? "ok" : "no"}">
    <div class="fb-main">${ok ? "✓ 对。" : "✗ "}正确答案：<b>${esc(right)}</b></div>
    <div class="fb-row"><span class="lab">当前义项</span><span>${target.pos ? `<b>${esc(target.pos)}</b> ` : ""}${esc(target.item || right)}</span></div>
    ${example ? `<div class="fb-ex">${esc(example.en)}<div style="color:var(--tx3);font-size:11.5px">${esc(example.zh || "")}</div><div class="src">${esc(exSrc)} · ${esc(exLabel)}</div></div>` : ""}
    ${ok ? "" : `<span class="fb-back">已放回近期队列。${q.given === "__STUCK__" ? "你点了「我卡住了」，按没想起来记。" : ""}</span>`}
  </div>`;
}

function detailHtml(d, q) {
  const p = PROG[d.id] || blank();
  const current = q.target ? q.target.item : "";
  const allItems = (d.senses || []).flatMap(s => s.items || []);
  const otherCount = Math.max(0, allItems.length - (current && allItems.includes(current) ? 1 : 0));

  // 折叠区只放“当前义项之外”的东西；当前义项已经在反馈里了。
  const glossRow = d.gloss && current !== d.gloss
    ? `<div class="sense-row"><span class="pos">考纲</span><span class="items">${esc(d.gloss)}</span></div>`
    : "";
  const otherSenses = (d.senses || []).map(s => ({
    pos: s.pos || "",
    items: (s.items || []).filter(x => x !== current)
  })).filter(s => s.items.length);
  const senses = (glossRow || otherSenses.length)
    ? `<div class="sensebox">${glossRow}${otherSenses.map(s => `
        <div class="sense-row"><span class="pos">${esc(s.pos)}</span><span class="items">${esc(s.items.join("、"))}</span></div>`).join("")}</div>`
    : `<div class="sensebox" style="color:var(--tx3);font-size:12.5px">没有其它义项。</div>`;

  let exam = "";
  if (d.exam) {
    exam += `<div class="exam-mini"><div>${esc(d.exam.en)}</div><div style="color:var(--tx2);font-size:11.5px">${esc(d.exam.zh)}</div>
      <div class="src">${esc(d.exam.src)} · ${esc(d.examKind || "真题语料")}｜真题原句回放</div></div>`;
  }
  if (d.gen) {
    exam += `<div class="exam-mini gen"><div>${esc(d.gen.en)}</div><div style="color:var(--tx2);font-size:11.5px">${esc(d.gen.zh)}</div>
      <div class="src">${esc(d.gen.src)} · 生成短句，非真题</div></div>`;
  }

  const rows = ABILITIES.map(k => {
    const lv = p[k] || 0;
    const dots = `<span class="dot ${lv >= 1 ? "on1" : ""}"></span><span class="dot ${lv >= 2 ? "on2" : ""}"></span>`;
    return `<div class="abrow"><span class="lab">${AB_SHORT[k]}</span><span class="dots">${dots}</span>
      <span class="statetxt">${lv >= 2 ? "稳" : lv === 1 ? "不稳" : "未测"}</span>
      <span class="wrongcount">错 ${(p.wrong && p.wrong[k]) || 0}</span></div>`;
  }).join("");

  return `<details class="peek">
    <summary>其余 ${otherCount} 个义项 / 能力明细 ▾</summary>
    <div class="detail">
      <div class="detail-grid">
        <div><h4>其余义项</h4>${senses}${exam}
          <p class="detail-note">当前义项已在卡片反馈里显示；这里只放其余义项。义项是从 ECDICT 机械切分的，生僻义未人工核对。</p>
        </div>
        <div><h4>四种能力明细</h4>${rows}
          <p class="detail-note">${p.grad ? "这个词四项都稳，已毕业并永久移出冲刺池。" : "系统只按最弱项排下一题；你现在不用管另外三项。"}</p>
          <p class="detail-note">累计作答 ${p.seen || 0} 次 · 错题 ${wrongTotal(d.id)} 次</p>
        </div>
      </div>
    </div>
  </details>`;
}

function doneHtml() {
  if (!Q.final) finalizeQuiz();
  const n = Q.items.length;
  const bad = Q.wrong.length;
  const acc = n ? Math.round((n - bad) / n * 100) : 0;
  const scene = Q.mode === "scene";
  const canAgain = scene
    ? sceneWords(Q.sceneTitle).some(d => !isGrad(d.id) && needsMeaning(d))
    : buildTodayQueue().ids.length > 0;
  return `<div class="studycard donecard">
    <div class="eyebrow">${scene ? "场景练习" : "这一轮"}做完了</div>
    <div class="bignum">${n}<small>张</small></div>
    <p>错 ${bad} 张 · 正确率 ${acc}%${scene ? "" : "。做错的已经放回近期队列，明天会先碰到它们。"}</p>
    <div class="row2">
      ${canAgain
        ? `<button type="button" class="primary" data-act="${scene ? "scene-again" : "again"}">${scene ? "再练这个场景" : "再来一轮"}</button>`
        : `<button type="button" class="primary" data-act="${scene ? "scene-back" : "go-scene"}">${scene ? "回场景列表" : "去场景词汇"}</button>`}
      <button type="button" class="textlink" data-act="${scene && canAgain ? "scene-back" : "go-diag"}">${scene && canAgain ? "回场景列表" : "看看诊断"}</button>
    </div>
    ${!canAgain ? `<p class="quiet" style="margin-bottom:0;margin-top:14px">${scene ? "这个场景暂时没有可练的词了。" : "今天的额度用完了。明天队列会按超期程度补上，断了也不会归零。"}</p>` : ""}
    ${Q.fromPredict ? `<p class="quiet" style="margin-bottom:0;margin-top:18px"><button type="button" class="textlink" data-act="go-predict">本轮预测对照已记下 →</button></p>` : ""}
    ${Q.results.length ? `<details class="peek" style="text-align:left;margin-top:18px">
      <summary>本轮明细</summary>
      <div class="tablewrap"><table class="res-tbl"><thead><tr><th>词</th><th>能力</th><th>结果</th><th>当前档</th></tr></thead><tbody>
        ${Q.results.map(r => {
          const d = DATA.find(x => x.id === r.id) || {};
          const pp = PROG[r.id] || {};
          const lv = pp[r.kind] || 0;
          return `<tr><td><b>${esc(d.w || r.id)}</b></td><td>${AB_LABEL[r.kind]}</td>
            <td class="${r.ok ? "hit" : "miss"}">${r.ok ? "对" : "错"}</td>
            <td>${lv >= 2 ? "稳" : lv === 1 ? "不稳" : "未测"}</td></tr>`;
        }).join("")}
      </tbody></table></div>
    </details>` : ""}
  </div>`;
}

/* ── 作答 ───────────────────────────────────────────────── */
/* 旧版只有 PROG、没有排程记录：把练过的词补成“到期复习”，
   首次日期记成昨天，避免被误算进今天的新词额度。 */
function seedLegacySchedule() {
  const y = dayKey(Date.now() - DAY);
  Object.keys(PROG).forEach(id => {
    const p = PROG[id];
    if (!p || !p.seen) return;
    if (!SCHED[id]) {
      SCHED[id] = { i: 1, d: Date.now(), l: 0, first: y, s: 0 };
    }
  });
}
seedLegacySchedule();

function answer(val) {
  if (!Q.active || !Q.cur || Q.cur.answered) return;
  const q = Q.cur;
  q.answered = true;
  q.given = val;
  q.ok = (val === q.answer);
  const p = P(q.d.id);
  p.seen = (p.seen || 0) + 1;
  const before = p[q.kind] || 0;
  if (q.ok) {
    p[q.kind] = Math.min(2, before + 1);
  } else {
    p[q.kind] = Math.max(0, before - 1);
    if (!p.wrong) p.wrong = { read: 0, listen: 0, write: 0, sense: 0 };
    p.wrong[q.kind] = (p.wrong[q.kind] || 0) + 1;
    Q.wrong.push(q.d.id);
  }
  q.before = before;
  updateSched(q.d.id, q.ok, p);
  LOG[dayKey()] = (LOG[dayKey()] || 0) + 1;
  if (!p.grad && ABILITIES.every(k => (p[k] || 0) >= 2)) {
    p.grad = true;
    toast(q.d.w + " 四项都稳，已毕业，移出冲刺池");
  }
  Q.results.push({ id: q.d.id, kind: q.kind, ok: q.ok });
  // 手动队列只服务今天这一轮；做过的词从今日手动队列移除，避免同一张卡再出现。
  if (isManual(q.d.id)) removeManual(q.d.id);
  save();

  clearTimeout(ADVANCE_TIMER);
  render();
  ADVANCE_TIMER = setTimeout(() => {
    if (Q.active && Q.cur && Q.cur.answered) nextQ();
  }, q.ok ? 2200 : 3200);
}

function nextQ() {
  clearTimeout(ADVANCE_TIMER);
  if (!Q.active) return;
  Q.i++;
  Q.cur = null;
  if (Q.i >= Q.items.length) finalizeQuiz();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function finalizeQuiz() {
  if (!Q.active || Q.final) return;
  const actual = [...new Set(Q.wrong)];
  const sysHit = PRED.sys.filter(id => actual.includes(id)).length;
  const userHit = PRED.user.filter(id => actual.includes(id)).length;
  Q.final = {
    actual,
    sysHit,
    userHit,
    sysExtra: PRED.sys.length - sysHit,
    userExtra: PRED.user.length - userHit
  };
  if (Q.fromPredict) {
    HISTORY.push({
      ts: Date.now(), n: Q.items.length,
      sys: PRED.sys.slice(), user: PRED.user.slice(), actual,
      sysHit, userHit,
      sysExtra: Q.final.sysExtra, userExtra: Q.final.userExtra
    });
    save();
  }
  PRED.active = false;
}

function addCurrent() {
  const d = Q.cur && Q.cur.d;
  if (!d) return;
  if (isMy(d.id)) { toast("已经在我的词库"); return; }
  MY.push(d.id);
  save();
  toast("已加入我的词库，会参与同样的义项出题");
  render();
}

/* ── 场景词汇 ───────────────────────────────────────────── */
const PINNED_TOPICS = [
  "健康、疾病与医疗", "交通、运输与车辆", "商业、公司与经营", "食物、饮料与饮食",
  "情绪与情感", "法律、法规与司法", "工作、就业与职业生涯", "旅行、旅游与行程",
  "环境、生态与污染", "金钱、银行与金融", "贸易、市场与买卖", "建筑、房屋与住所"
];

function topicStats() {
  const map = new Map();
  DATA.forEach(d => {
    if (d.custom) return;
    const t = d.topic || "未分类";
    if (!map.has(t)) map.set(t, { total: 0, basic: 0 });
    const x = map.get(t);
    x.total++;
    if (isBasicWord(d)) x.basic++;
  });
  return [...map.entries()].map(([t, x]) => ({ t, ...x })).sort((a, b) => b.total - a.total);
}

function renderScene() {
  if (SCENE.topic) return renderSceneTopic();
  const stats = topicStats();
  const pinSet = new Set(PINNED_TOPICS);
  const pinned = PINNED_TOPICS.map(t => stats.find(x => x.t === t)).filter(Boolean);
  const rest = stats.filter(x => !pinSet.has(x.t));
  const myN = MY.length;

  const topicBtn = (x, cls) => {
    const n = SCENE.basicOnly ? x.basic : x.total;
    const disabled = SCENE.basicOnly && x.basic === 0;
    return `<button type="button" class="topic ${cls || ""}" data-act="scene-topic" data-topic="${esc(x.t)}" ${disabled ? "disabled" : ""}>
      <b>${esc(x.t)}</b><span>${SCENE.basicOnly ? `基础 ${x.basic} 词 · 全部 ${x.total}` : `${x.total} 词`}</span></button>`;
  };

  const pinnedHtml = pinned.filter(x => !SCENE.basicOnly || x.basic > 0).map(x => topicBtn(x, "pinned")).join("");
  const restHtml = rest.filter(x => !SCENE.basicOnly || x.basic > 0);
  const showRest = SCENE.showAll ? restHtml : restHtml.slice(0, 18);
  const moreBtn = restHtml.length > 18 && !SCENE.showAll
    ? `<button type="button" class="topicmore" data-act="scene-more">展开全部 ${restHtml.length} 个场景</button>` : "";

  return `<div class="scene">
    <div class="scenehead">
      <div><h1>场景词汇</h1>
      <p>按主题自己挑。进入练习后仍然走同样的义项级出题和四种能力记分，不按系统优先级排。</p></div>
      <label class="switch"><input type="checkbox" id="basicOnly" ${SCENE.basicOnly ? "checked" : ""}>只看基础词</label>
    </div>
    <div class="honest"><b>一句诚实话：</b>现有词库是六级词库，topic 是语义分类，不是难度分类；「只看基础词」是用 CEFR A1–B1 或柯林斯 4–5 星近似过滤的，不是严格的基础词表。真正的日常基础词库需要额外导入数据。</div>
    <div class="scenesep">常用场景</div>
    <div class="topicgrid">
      ${myN ? `<button type="button" class="topic mine" data-act="scene-topic" data-topic="我的词库"><b>我的词库</b><span>${myN} 词 · 随手加的和导入的</span></button>` : ""}
      ${pinnedHtml || ""}
    </div>
    ${restHtml.length ? `<div class="scenesep">更多场景</div><div class="topicgrid">${showRest.map(x => topicBtn(x)).join("")}${moreBtn}</div>` : ""}
    ${SCENE.basicOnly && !pinnedHtml && !restHtml.length ? '<div class="empty">这个近似条件下，现有场景里没有基础词。</div>' : ""}
  </div>`;
}

function sceneWords(topic) {
  let list;
  if (topic === "我的词库") list = DATA.filter(d => isMy(d.id));
  else list = DATA.filter(d => !d.custom && (d.topic || "未分类") === topic);
  if (SCENE.basicOnly && topic !== "我的词库") list = list.filter(isBasicWord);
  return list.slice().sort((a, b) => (b.freq || 0) - (a.freq || 0) || dynamicPri(b) - dynamicPri(a));
}

function renderSceneTopic() {
  const topic = SCENE.topic;
  const list = sceneWords(topic);
  const practice = list.filter(d => !isGrad(d.id) && needsMeaning(d));
  const n = Math.min(SETTINGS.sceneBatch, practice.length);
  const rows = list.map(d => {
    const badges = [
      d.cefr ? `<span class="bd">${esc(d.cefr)}</span>` : "",
      d.collins ? `<span class="bd">柯林斯 ${esc(d.collins)}星</span>` : "",
      d.freq ? `<span class="bd">真题词频 ${d.freq}</span>` : "",
      isGrad(d.id) ? `<span class="bd ok">已毕业</span>` : "",
      d.custom ? `<span class="bd blue">自定义</span>` : ""
    ].filter(Boolean).join("");
    return `<div class="wrow">
      <span class="w">${esc(d.w)}</span><span class="g">${esc(d.gloss || "（暂无简要释义）")}</span>
      <span class="badges">${badges}</span>
      <button type="button" class="togg" data-act="wrow" data-id="${esc(d.id)}">义项 ▾</button>
      <div class="wdetail" id="wd-${esc(d.id)}" hidden>
        ${(d.senses || []).length ? (d.senses || []).map(s => `<div class="sense" style="font-size:12.5px"><span class="pos">${esc(s.pos || "")}</span><span class="items">${esc((s.items || []).join("、"))}</span></div>`).join("") : `<span style="color:var(--tx3)">暂无切分义项</span>`}
        ${d.exam ? `<div class="exam" style="margin-top:6px"><div class="en">${esc(d.exam.en)}</div><div class="zh">${esc(d.exam.zh)}</div><div class="src">${esc(d.exam.src)}</div></div>` : ""}
      </div>
    </div>`;
  }).join("");

  return `<div class="scene">
    <div class="scenetop">
      <button type="button" class="textlink back" data-act="scene-back">← 全部场景</button>
      <h1>${esc(topic)}</h1>
      <span class="count">${list.length} 词${SCENE.basicOnly && topic !== "我的词库" ? " · 只看基础词" : ""}</span>
    </div>
    <div class="scenebar">
      <button type="button" class="primary" data-act="scene-start" ${n ? "" : "disabled"}>练这个场景 · ${n} 张</button>
      ${topic !== "我的词库" ? `<label class="switch"><input type="checkbox" id="basicOnly" ${SCENE.basicOnly ? "checked" : ""}>只看基础词</label>` : ""}
      ${SCENE.basicOnly && topic !== "我的词库" ? '<span class="note">CEFR A1–B1 或柯林斯 4–5 星</span>' : ""}
      ${topic === "我的词库" ? '<span class="note">自定义词也走同一套义项出题和四维记分</span>' : ""}
    </div>
    <div class="scenelist">${rows || '<div class="empty">这个场景下没有词。</div>'}</div>
  </div>`;
}

function startSceneSession() {
  const topic = SCENE.topic;
  const list = sceneWords(topic).filter(d => !isGrad(d.id) && needsMeaning(d)).slice(0, SETTINGS.sceneBatch);
  if (!list.length) { toast("这个场景没有可练的词"); return; }
  if (Q.active && Q.i < Q.items.length) {
    if (!confirm("会结束当前这一轮（已经答过的都已保存）。继续？")) return;
  }
  PRED = { active: false, ids: [], sys: [], user: [], done: [] };
  Q = {
    active: true, board: "scene", mode: "scene",
    items: list, i: 0, cur: null, wrong: [], results: [], fromPredict: false, final: null,
    reviewN: 0, sceneTitle: topic
  };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ═══════════════════════════════════════════════════════════
   第三层：诊断页（总览 / 词库 / 查词 / 预测校验 / 数据）
   ═══════════════════════════════════════════════════════════ */

const DIAG_TABS = [
  ["overview", "总览"], ["library", "词库"], ["lookup", "查词"],
  ["predict", "预测校验"], ["data", "数据与来源"]
];

function renderDiag() {
  let body = "";
  if (DIAG_TAB === "overview") body = diagOverview();
  else if (DIAG_TAB === "library") body = diagLibrary();
  else if (DIAG_TAB === "lookup") body = diagLookup();
  else if (DIAG_TAB === "predict") body = diagPredict();
  else body = diagData();
  return `<div class="diag">
    <div class="diaghead"><div><h1>诊断 · 后台</h1>
      <p class="sub">这些数字是给你看的，不是每天要打卡的任务。学习页只留一张卡。</p></div></div>
    <div class="subnav">${DIAG_TABS.map(([k, t]) => `<button type="button" class="${DIAG_TAB === k ? "on" : ""}" data-act="diag-tab" data-tab="${k}">${t}</button>`).join("")}</div>
    ${body}
  </div>`;
}

/* ── 总览 ───────────────────────────────────────────────── */
function weakestLabel(id) {
  const p = PROG[id];
  if (!p || !p.seen) return "四项未测";
  const min = Math.min(...ABILITIES.map(k => p[k] || 0));
  const weak = ABILITIES.filter(k => (p[k] || 0) === min);
  return "最弱 " + weak.map(k => AB_SHORT[k]).join(" / ");
}

function diagOverview() {
  const total = DATA.length;
  const grad = DATA.filter(d => isGrad(d.id)).length;
  const seen = Object.values(PROG).filter(p => p && p.seen > 0).length;
  const examN = DATA.filter(d => d.exam).length;
  const sprintN = sprintPool().length;
  const dueN = sprintPool().filter(d => isDue(d.id)).length;
  const q = buildTodayQueue();
  const newN = q.newTotal;
  const revN = q.reviews.length;

  const abilityCards = ABILITIES.map(k => {
    const stable = Object.values(PROG).filter(p => p && (p[k] || 0) >= 2).length;
    const lv1 = Object.values(PROG).filter(p => p && (p[k] || 0) === 1).length;
    const tested = Object.values(PROG).filter(p => p && ((p[k] || 0) > 0 || ((p.wrong && p.wrong[k]) || 0) > 0)).length;
    const ratio = tested ? Math.round(stable / tested * 100) : 0;
    return `<div class="abilitycard"><div class="t">${AB_LABEL[k]}</div>
      <div class="v">${stable}<small> 稳</small></div>
      <div class="progress bar"><i style="width:${ratio}%"></i></div>
      <div class="foot">练过 ${tested} · 不稳 ${lv1} · 错题 ${Object.values(PROG).reduce((a, p) => a + ((p.wrong && p.wrong[k]) || 0), 0)}</div></div>`;
  }).join("");

  const queueRows = [...q.manual.map(d => ({ d, type: "手动" })), ...q.reviews.map(d => ({ d, type: "到期" })), ...q.news.map(d => ({ d, type: "新词" }))]
